<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Política de seguridad de contenido (CSP). La impone el propio navegador:
     - connect-src 'self': la página no puede abrir conexiones (fetch, XHR,
       WebSocket...) a ningún dominio ajeno, así que aunque se colara código
       malicioso no podría enviar tus datos a un servidor de terceros.
     - script-src/style-src: solo el código incluido en este archivo; se
       prohíbe cargar scripts o estilos externos. 'unsafe-inline' es
       necesario porque la app usa atributos onclick; por eso, como segunda
       barrera, los backups importados se validan (validateBackup).
     - Sin 'unsafe-eval': no se puede ejecutar texto como código (eval).
     - form-action 'none' y base-uri 'none': ningún formulario puede enviar
       datos fuera ni se puede redirigir la base de las rutas relativas.
     - img-src permite data:/blob: (iconos SVG del CSS y exportación). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Roney</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roney">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --border:#E4E7EB; --border-strong:#D3D8DE;
    --text:#1C2430; --muted:#6B7684; --muted-2:#9AA3AD;
    --primary:#2F6FED; --primary-ink:#FFFFFF;
    --income:#17A673; --expense:#E0533D; --cash:#C98A1F; --social:#B54EA0; --goal:#0EA5A0;
    --danger:#D3402E; --radius:14px; --radius-sm:10px;
    /* Colores de superficie que cambian en modo oscuro. Se definen como
       variables para no repetir colores fijos (#fff...) por el código. */
    --input-bg:#FFFFFF; --soft-primary:#EEF3FE; --soft-unread:#F7FAFF; --soft-danger:#FDEDEE;
    --toast-bg:#1C2430; --shadow:0 1px 2px rgba(20,30,40,.04);
    --nav-h:62px;
    color-scheme:light;
  }
  /* Modo oscuro automático según el ajuste del sistema (iOS: Ajustes →
     Pantalla y brillo). Solo se redefinen variables; el resto del CSS no
     cambia. Los colores semánticos se aclaran un poco para mantener el
     contraste sobre fondo oscuro. */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1318; --card:#181D24; --border:#262D36; --border-strong:#36404B;
      --text:#E8ECF1; --muted:#9AA4B0; --muted-2:#6F7A86;
      --primary:#4C84F5; --income:#2BBF86; --expense:#F06A55; --cash:#D9A03A; --social:#C96BB5; --goal:#22B8B3;
      --danger:#F0604D;
      --input-bg:#11161C; --soft-primary:#1B2A44; --soft-unread:#172131; --soft-danger:#3A1D1A;
      --toast-bg:#E8ECF1; --shadow:none;
      color-scheme:dark;
    }
    .toast{color:#0F1318 !important;}
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;}
  /* La barra inferior es fija: el contenido necesita un margen igual a su
     altura MÁS la zona del indicador de inicio del iPhone; si no, lo último
     de cada pantalla queda tapado. */
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  /* Fondo y texto de los campos ligados a variables: así los inputs con
     estilo en línea también se adaptan al modo oscuro. */
  input:not([type=checkbox]):not([type=range]):not([type=color]):not([type=file]), select, textarea{
    background-color:var(--input-bg);color:var(--text);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .hidden{display:none !important;}

  /* Con status-bar-style "black-translucent" el contenido se dibuja bajo
     la barra de estado/Dynamic Island; safe-area-inset-top reserva ese
     espacio para que el logo y los iconos no queden debajo. */
  header.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px;
    display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.2px;}
  .brand-dot{width:10px;height:10px;border-radius:99px;background:var(--income);}
  .icon-btn{border:none;background:transparent;color:var(--muted);padding:8px;border-radius:99px;display:flex;position:relative;transition:transform .12s, background .12s;}
  .icon-btn:active{background:var(--border);transform:scale(.92);}
  .icon-badge{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:99px;background:var(--danger);border:1.5px solid var(--bg);}
  main{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;}

  nav.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
    border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
  .navgrid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px;min-height:var(--nav-h);justify-content:center;
    background:none;border:none;color:var(--muted-2);font-size:10px;transition:color .15s, transform .15s;}
  .navitem.active{color:var(--primary);transform:translateY(-1px);}
  .navitem svg{width:19px;height:19px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);transition:box-shadow .15s;min-width:0;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .label{color:var(--muted);font-size:13px;}
  .muted{color:var(--muted);}
  .muted-2{color:var(--muted-2);}
  .num{font-variant-numeric:tabular-nums;}
  .big{font-size:28px;font-weight:700;}
  .divider{border:none;border-top:1px solid var(--border);margin:4px 0;}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--border);color:var(--muted);}
  .badge.new{background:var(--soft-danger);color:var(--danger);}
  .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;display:inline-block;}
  .avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
  .item-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .item-text{min-width:0;}
  .item-text .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .btn{border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--card);
    color:var(--text);padding:11px 14px;font-size:15px;font-weight:600;min-height:44px;
    transition:transform .1s, opacity .1s;}
  .btn:active{opacity:.75;transform:scale(.97);}
  .btn.block{width:100%;}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
  .btn.income{background:var(--income);border-color:var(--income);color:#fff;}
  .btn.expense{background:var(--expense);border-color:var(--expense);color:#fff;}
  .btn.social{background:var(--social);border-color:var(--social);color:#fff;}
  .btn.goal{background:var(--goal);border-color:var(--goal);color:#fff;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn.small{padding:7px 10px;font-size:13px;min-height:36px;}
  .btn[disabled]{opacity:.4;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}
  .kindrow .btn{ font-size:13.5px; padding:11px 6px; white-space:normal; line-height:1.2; text-align:center; }

  .quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:600;transition:transform .1s;}
  .quick-btn:active{transform:scale(.95);}
  .quick-ico{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:#fff;}

  label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);}
  .field input, .field select, .field textarea{
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:11px 12px;
    background-color:var(--input-bg);color:var(--text);min-height:44px;}
  .field textarea{min-height:70px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  /* Los elementos de grid/flex no se encogen por debajo del ancho de su
     contenido por defecto: un <input type="date"> o <select> nativo puede
     entonces salirse de su columna y desbordar la tarjeta. min-width:0
     fuerza a que respeten el ancho disponible en vez del intrínseco. */
  .grid2 > *, .grid3 > *, .btn-row > *, label.field{ min-width:0; }
  .field input, .field select, .field textarea{ width:100%; max-width:100%; }
  input[type="date"], input[type="color"]{ min-width:0; }

  /* input[type=date] y select traen estilo nativo del sistema operativo que
     no siempre respeta las mismas medidas que el resto de campos (altura,
     padding), así que se normalizan explícitamente para que se vean igual
     que un input de texto normal. */
  .field input[type="date"]{
    height:44px; min-height:44px; padding:0 12px; line-height:normal;
    -webkit-appearance:none; appearance:none;
  }
  .field select{
    height:44px; min-height:44px;
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7684' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:15px;
    padding-right:34px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .checkrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:15px;}
  .checkrow:last-child{border-bottom:none;}
  .checkrow input{width:19px;height:19px;}
  .payrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;}
  .payrow span{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .payrow input{width:100px;flex:0 0 auto;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 9px;text-align:right;min-width:0;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .tabs .btn{white-space:nowrap;}

  .empty{color:var(--muted-2);font-size:14px;padding:10px 2px;line-height:1.5;}
  .helper{color:var(--muted-2);font-size:12.5px;line-height:1.5;margin-top:6px;}

  .meter{background:var(--bg);height:8px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .meter-fill{height:100%;transition:width .5s ease;}

  input[type="range"]{width:100%;accent-color:var(--primary);height:30px;}

  .lock-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .lock-card{width:100%;max-width:340px;}
  .pin-input{text-align:center;letter-spacing:8px;font-size:22px;font-family:ui-monospace,monospace;}

  .kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
  svg text{font-family:-apple-system,Helvetica,Arial,sans-serif;}
  .toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--toast-bg);color:#fff;
    padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);}
  .toast-action{background:none;border:none;color:var(--primary);font-weight:700;font-size:13px;padding:2px 0;}

  .overlay{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:center;justify-content:center;
    z-index:70;padding:20px;}
  .overlay .card{max-width:340px;width:100%;}

  .donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;gap:6px;}

  .subnav{display:flex;gap:6px;}
  .subnav .btn{flex:1;}
  .notif-card{border-left:3px solid var(--border-strong);}
  .notif-card.unread{border-left-color:var(--primary);background:var(--soft-unread);}

  /* Selector segmentado (Ingreso/Gasto/Transferencia). Sustituye a tres
     botones sueltos: un único contenedor con segmentos iguales y texto más
     compacto evita que «Transferencia» desborde en pantallas de 375–393 px
     (ver docs/IMG_7539.PNG). */
  /* Análisis */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-width:0;box-shadow:var(--shadow);}
  .kpi .v{font-size:18px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kpi .s{font-size:11.5px;color:var(--muted-2);margin-top:3px;line-height:1.35;}
  .chart-tip{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px;margin-top:6px;min-height:32px;line-height:1.4;}
  .chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  [data-chart]{cursor:pointer;}
  circle[data-chart].sel{stroke:var(--text);stroke-width:2px;}
  /* Selección: la columna táctil (rect sin esquinas) se sombrea; las barras
     visibles (con rx) solo se perfilan, sin cambiar su color. */
  rect[data-chart]:not([rx]).sel{fill:var(--text) !important;opacity:.08;}
  rect[data-chart][rx].sel{stroke:var(--text);stroke-width:1.5px;}
  .heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .heat .h{aspect-ratio:1;border-radius:7px;font-size:11.5px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);color:var(--text);padding:0;background:transparent;min-width:0;}
  .heat .h.sel{outline:2px solid var(--text);outline-offset:-1px;}
  .heat .dow{font-size:10.5px;color:var(--muted-2);text-align:center;}
  .tap{cursor:pointer;}
  .legend-row.tap{padding:3px 0;}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);}
  .seg > button{min-width:0;border:none;background:transparent;border-radius:8px;padding:9px 2px;min-height:38px;
    font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .12s,color .12s;}
  .seg > button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .seg > button.on.income{background:var(--income);color:#fff;}
  .seg > button.on.expense{background:var(--expense);color:#fff;}
  .seg > button.on.primary{background:var(--primary);color:#fff;}
  .month-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);
    padding:12px 0 4px;border-bottom:1px solid var(--border);font-weight:600;}
  .tx-note{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-main{min-width:0;flex:1;}
  .tx-main .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;}
  .tx-main .muted-2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .search{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;min-height:44px;}
  select.search{height:44px;-webkit-appearance:none;appearance:none;padding-right:30px;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7684' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;background-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  input[type="search"]{-webkit-appearance:none;appearance:none;}
  .profile-opt{text-align:left;border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);background:transparent;transition:border-color .15s, background .15s;}
  .profile-opt.on{border-color:var(--primary);background:var(--soft-primary);}
  .stat{font-size:20px;font-weight:700;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div id="lockScreen" class="lock-wrap hidden">
  <div class="card lock-card stack">
    <div class="brand"><span class="brand-dot"></span>RONEY</div>
    <p class="muted" id="lockText" style="font-size:13px;margin:0;"></p>
    <!-- Formulario real (sin envío) con usuario oculto: así el gestor de
         contraseñas de iOS puede ofrecer guardar y rellenar la frase. -->
    <form class="stack" onsubmit="event.preventDefault();Roney.submitPin();" autocomplete="on">
      <input type="text" name="username" value="Roney" autocomplete="username" hidden readonly>
      <input id="pinInput" name="password" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" style="border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:12px;min-height:48px;">
      <input id="pinConfirm" class="hidden" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" style="border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:12px;min-height:48px;">
      <label id="lockAck" class="hidden" style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.4;">
        <input id="lockAckCheck" type="checkbox" style="width:18px;height:18px;flex:0 0 auto;margin-top:1px;">
        Entiendo que si olvido la frase de paso mis datos no se podrán recuperar de ninguna forma.
      </label>
      <div id="lockError" role="alert" style="color:var(--danger);font-size:12.5px;min-height:16px;"></div>
      <button id="lockBtn" type="submit" class="btn primary block">Continuar</button>
    </form>
    <p class="helper" id="lockHelp"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>RONEY</div>
    <div style="display:flex;gap:2px;">
      <button class="icon-btn" title="Notificaciones" aria-label="Notificaciones" onclick="Roney.goTab('notificaciones')">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="notifBadge" class="icon-badge hidden"></span>
      </button>
      <button class="icon-btn" title="Perfil" aria-label="Perfil" onclick="Roney.goTab('perfil')">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
      <button class="icon-btn" title="Ajustes" aria-label="Ajustes" onclick="Roney.goTab('ajustes')">

<script>
/* ==========================================================================
   RONEY — aplicación de seguimiento financiero personal
   100% independiente: HTML+CSS+JS autocontenido, sin llamadas externas,
   sin dependencias de terceros ni de Claude. Persistencia en localStorage
   del navegador (por dispositivo).

   Nota de fiabilidad: en iOS, cuando esta app se añade a la pantalla de
   inicio (modo standalone), los diálogos nativos confirm()/alert() no se
   muestran de forma fiable. Por eso todas las confirmaciones usan un
   modal propio (showConfirm) en lugar de confirm().

   Nota sobre "notificaciones": no son notificaciones push del sistema
   operativo (esta app no tiene servidor ni permisos para eso). Son avisos
   que se generan dentro de la propia app cada vez que la abres, si toca
   revisar algo (movimiento recurrente pendiente, informe mensual nuevo...).
   ========================================================================== */

const STORAGE_KEY = "roney_state_v1";
const PIN_KEY = "roney_pin_v1";
/* Versión visible en Ajustes. Súbela junto con CACHE_NAME de sw.js para
   poder comprobar en el iPhone qué versión se está ejecutando. */
const APP_VERSION = "2.3";
const SOCIAL_CONCEPT_COLOR = "#B54EA0";

const NAV = [
  {id:"inicio", label:"Inicio", icon:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'},
  {id:"cuentas", label:"Cuentas", icon:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18"/><path d="M7 15h4"/>'},
  {id:"movimientos", label:"Movs.", icon:'<path d="M7 7h13M7 7l-4 4M7 7l-4-4"/><path d="M17 17H4M17 17l4 4M17 17l4-4"/>'},
  {id:"social", label:"Social", icon:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.6"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M14.5 14.8c2.6.3 4.5 2.2 4.5 5.2"/>'},
  {id:"objetivos", label:"Objetivos", icon:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>'},
  {id:"analisis", label:"Análisis", icon:'<path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/>'},
];

const DEFAULT_STATE = {
  accounts: [], bundles: [], concepts: [], transactions: [],
  profile: null, monthlyIncome: 0, social: [], customSplit: null,
  recurring: [], notifications: [], goals: [], loans: [],
  /* settings: preferencias de la app (bloqueo automático, fecha de la última
     copia de seguridad). budgetAlerts: avisos de presupuesto ya emitidos,
     para no repetirlos ("AAAA-MM|conceptId|nivel"). */
  settings: {}, budgetAlerts: [],
};
/* Copia profunda del estado por defecto. Con {...DEFAULT_STATE} los arrays
   se compartían entre la plantilla y el estado real, de modo que tras
   borrar o importar datos la plantilla podía quedar "contaminada". */
function freshState(){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }

let state = null;
let ui = {
  tab: "inicio", socialSelected: null, txForm: {}, forms: {}, settleFlow: null,
  customSplitDraft: null, expenseForm: {}, objTab: "metas", showHistorial: false,
  amortCalc: {principal:10000, rate:6, months:36, result:null},
};

/* ------------------------------ utilidades ------------------------------ */

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function eur(n){
  const v = Number(n)||0;
  return v.toLocaleString("es-ES", {style:"currency", currency:"EUR", maximumFractionDigits:2});
}
function eurShort(n){ return Math.round(Number(n)||0) + "€"; }
/* Fecha local en formato AAAA-MM-DD. Antes se usaba toISOString(), que
   devuelve la fecha en UTC: en España (UTC+1/+2), un movimiento registrado
   entre las 00:00 y las 01:00/02:00 quedaba fechado el día anterior, y el
   día 1 de mes a esas horas contaba en el mes anterior. */
function localISO(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayISO(){ return localISO(new Date()); }
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${MONTHS[m-1].slice(0,3)} ${y}`;
}
/* Convierte el texto de un campo de importe a número. Acepta coma o punto
   decimal ("12,50" o "12.50") porque el teclado numérico de iOS en español
   muestra coma; con <input type="number"> Safari puede devolver "" ante una
   coma y el importe se perdía. Devuelve NaN si no es un número válido.
   Se redondea a céntimos para no arrastrar decimales espurios. */
function parseAmount(raw){
  let s = String(raw ?? "").trim().replace(/\s|€/g, "");
  if(!s) return NaN;
  // "1.234,56" → separador de miles "." y decimal ","
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(",", ".");
  if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return Math.round(Number(s)*100)/100;
}
/* Lee y valida un campo de importe del DOM. */
function amountFrom(id){ const el = document.getElementById(id); return el ? parseAmount(el.value) : NaN; }
/* HTML de un campo de importe: texto con teclado decimal (ver parseAmount). */
function moneyInput(id, value, extra){
  const v = (value===undefined || value===null || value==="") ? "" : String(value).replace(".", ",");
  return `<input id="${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${v}" ${extra||""}>`;
}
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function yearOf(iso){ return iso ? iso.slice(0,4) : ""; }
function monthNumOf(iso){ return iso ? parseInt(iso.slice(5,7),10)-1 : 0; }
function addMonths(ym, delta){
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function daysBetween(isoA, isoB){
  return Math.round((new Date(isoB) - new Date(isoA)) / 86400000);
}
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function toCents(n){ return Math.round((Number(n)||0)*100); }
function fromCents(c){ return c/100; }

/* Aviso breve. Con action={label, fn} muestra un botón (p. ej. «Deshacer»)
   y permanece más tiempo para dar margen a pulsarlo. */
function toast(msg, action){
  const t = document.getElementById("toast");
  t.innerHTML = "";
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if(action){
    const b = document.createElement("button");
    b.className = "toast-action"; b.textContent = action.label;
    b.onclick = () => { t.classList.add("hidden"); clearTimeout(toast._h); action.fn(); };
    t.appendChild(b);
  }
  t.classList.remove("hidden");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.add("hidden"), action ? 5000 : 2200);
}

/* --------------------------- confirmación propia -------------------------- */

let pendingConfirm = null;
let pendingAlt = null;
/* opts.okLabel cambia el texto del botón; opts.safe=true lo pinta como
   acción normal (no destructiva). */
function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  pendingConfirm = onConfirm;
  document.getElementById("confirmText").textContent = message;
  const ok = document.getElementById("confirmOk");
  ok.textContent = opts.okLabel || "Confirmar";
  ok.className = "btn " + (opts.safe ? "primary" : "danger");
  // Tercera opción opcional (p. ej. elegir entre dos formatos de exportación).
  const alt = document.getElementById("confirmAlt");
  pendingAlt = opts.onAlt || null;
  alt.textContent = opts.altLabel || "";
  alt.classList.toggle("hidden", !opts.onAlt);
  document.getElementById("confirmOverlay").classList.remove("hidden");
}
window.Roney = window.Roney || {};
Roney.confirmYes = function(){
  document.getElementById("confirmOverlay").classList.add("hidden");
  const fn = pendingConfirm; pendingConfirm = null;
  if(fn) fn();
};
Roney.confirmNo = function(){
  document.getElementById("confirmOverlay").classList.add("hidden");
  pendingConfirm = null; pendingAlt = null;
};
Roney.confirmAlt = function(){
  document.getElementById("confirmOverlay").classList.add("hidden");
  const fn = pendingAlt; pendingAlt = null; pendingConfirm = null;
  if(fn) fn();
};

/* ------------------------------ cifrado ---------------------------------- */
/* Cofre cifrado (clave VAULT_KEY en localStorage):
     {v:1, kdf:"PBKDF2-SHA256", iter, salt, iv, ct}   (binarios en base64)
   - La clave AES-256-GCM se deriva de la frase de paso con PBKDF2-SHA256 y
     una sal aleatoria de 16 bytes. 600 000 iteraciones es la cifra que
     recomienda OWASP (2023) para PBKDF2-SHA256: encarece cada intento de
     adivinar la frase si alguien copia el almacenamiento.
   - GCM autentica además de cifrar: una frase incorrecta o un cofre
     manipulado hacen fallar el descifrado (no devuelve datos basura).
   - Cada guardado usa un IV (nonce) aleatorio nuevo de 12 bytes; reutilizar
     un IV con la misma clave rompería la seguridad de GCM.
   - La clave derivada se marca como no extraíble y solo vive en memoria
     mientras la app está desbloqueada; al bloquear se descarta.
   Todo usa WebCrypto, que viene con el navegador: sin librerías. */
const VAULT_KEY = "roney_vault_v1";
const KDF_ITER = 600000;
let vaultKey = null;   // CryptoKey en memoria mientras la app está abierta
let vaultSalt = null;  // Uint8Array de la sal del cofre actual
let vaultIter = KDF_ITER;

function b64(bytes){ let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function unb64(str){ const s=atob(str); const out=new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i); return out; }
function randomBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

async function deriveKey(passphrase, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptJSON(key, obj){
  const iv = randomBytes(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {iv:b64(iv), ct:b64(ct)};
}
/* Lanza una excepción si la clave no es la correcta o el contenido se ha alterado. */
async function decryptJSON(key, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(ivB64)}, key, unb64(ctB64));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* Sobre cifrado completo (cofre o copia de seguridad) a partir de una frase. */
async function sealWithPassphrase(obj, passphrase, iter){
  const salt = randomBytes(16);
  const key = await deriveKey(passphrase, salt, iter||KDF_ITER);
  return {key, salt, envelope:{v:1, kdf:"PBKDF2-SHA256", iter:iter||KDF_ITER, salt:b64(salt), ...(await encryptJSON(key, obj))}};
}
async function openWithPassphrase(envelope, passphrase){
  const salt = unb64(envelope.salt);
  const key = await deriveKey(passphrase, salt, envelope.iter);
  const data = await decryptJSON(key, envelope.iv, envelope.ct);
  return {key, salt, data};
}
function hasVault(){ return !!localStorage.getItem(VAULT_KEY); }
function readVault(){ try{ return JSON.parse(localStorage.getItem(VAULT_KEY)); }catch(e){ return null; } }

/* ------------------------------ persistencia ----------------------------- */

/* Construye el estado a partir de un objeto ya parseado (de localStorage, del
   cofre descifrado o de una copia importada), completando valores por
   defecto y migrando esquemas antiguos. */
function hydrateState(obj){
  state = obj ? {...freshState(), ...obj} : freshState();
  ensureDefaults();
  migrateData();
}
/* Carga los datos sin cifrar (modo antiguo con PIN). En modo cofre el estado
   se carga en unlockVault() tras descifrar. */
function loadState(){
  let obj = null;
  try{ const raw = localStorage.getItem(STORAGE_KEY); obj = raw ? JSON.parse(raw) : null; }catch(e){ obj = null; }
  hydrateState(obj);
}
/* En modo cofre, guardar es asíncrono (cifrar lleva unos milisegundos). Las
   escrituras se encadenan en una cola para que nunca se pise una versión
   nueva con una antigua que terminara de cifrarse más tarde. */
let saveChain = Promise.resolve();
function saveState(){
  if(vaultKey){
    const snapshot = JSON.parse(JSON.stringify(state));
    const key = vaultKey, salt = vaultSalt, iter = vaultIter;
    saveChain = saveChain
      .then(()=>encryptJSON(key, snapshot))
      .then(enc=>localStorage.setItem(VAULT_KEY, JSON.stringify({v:1, kdf:"PBKDF2-SHA256", iter, salt:b64(salt), ...enc})))
      .catch(()=>toast("No se pudo guardar: almacenamiento lleno o bloqueado."));
    return saveChain;
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ toast("No se pudo guardar: almacenamiento lleno o bloqueado."); }
  return Promise.resolve();
}
/* Pasa los datos actuales (sin cifrar) al cofre cifrado. Orden seguro:
   1) cifrar y escribir el cofre, 2) volver a leerlo y descifrarlo con la
   misma frase para comprobar que es recuperable, 3) solo entonces borrar la
   copia en claro y el PIN antiguo. Si algo falla antes del paso 3, los
   datos originales siguen intactos. */
async function migrateToVault(passphrase){
  const {key, salt, envelope} = await sealWithPassphrase(state, passphrase);
  localStorage.setItem(VAULT_KEY, JSON.stringify(envelope));
  const check = await openWithPassphrase(readVault(), passphrase);
  if(JSON.stringify(check.data) !== JSON.stringify(state)){
    localStorage.removeItem(VAULT_KEY);
    throw new Error("La verificación del cifrado ha fallado; no se ha cambiado nada.");
  }
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(PIN_KEY);
  vaultKey = key; vaultSalt = salt; vaultIter = envelope.iter;
}
/* Requisitos de la frase de paso. Un PIN de 4 dígitos son 10 000
   combinaciones: con el cofre copiado se probarían todas en poco tiempo
   pese a PBKDF2. Con 8+ caracteres variados el coste se dispara. */
function passphraseProblem(p){
  if(p.length < 8) return "La frase debe tener al menos 8 caracteres.";
  if(/^\d+$/.test(p) && p.length < 12) return "Si solo usas números, pon al menos 12; mejor mezcla letras y números.";
  if(/^(.)\1+$/.test(p)) return "No uses un único carácter repetido.";
  return null;
}
function ensureDefaults(){
  if(state.accounts.length===0){
    state.accounts.push({id:uid(), alias:"Cuenta principal", bank:"Sin especificar", isDefault:true});
  }
  if(state.bundles.length===0){
    state.bundles.push({id:uid(), name:"Efectivo principal", objetivo:"", isDefault:true});
  }
  if(state.concepts.length===0){
    state.concepts.push(
      {id:uid(), name:"Nómina", color:"#17A673", kind:"ingreso"},
      {id:uid(), name:"Beca / ayuda", color:"#2F6FED", kind:"ingreso"},
      {id:uid(), name:"Otros ingresos", color:"#9AA3AD", kind:"ingreso"},
      {id:uid(), name:"Comida", color:"#E0533D", kind:"gasto"},
      {id:uid(), name:"Transporte", color:"#C98A1F", kind:"gasto"},
      {id:uid(), name:"Vivienda", color:"#8E5FD6", kind:"gasto"},
      {id:uid(), name:"Ocio", color:"#2F6FED", kind:"gasto"},
      {id:uid(), name:"Salud", color:"#17A673", kind:"gasto"},
      {id:uid(), name:"Otros gastos", color:"#9AA3AD", kind:"gasto"},
    );
  }
  if(!state.customSplit) state.customSplit = {esencial:50, ahorro:20, inversion:20, discrecional:10};
  if(!state.recurring) state.recurring = [];
  if(!state.notifications) state.notifications = [];
  if(!state.goals) state.goals = [];
  if(!state.loans) state.loans = [];
  if(!state.settings || typeof state.settings!=="object") state.settings = {};
  if(state.settings.autoLockMin===undefined) state.settings.autoLockMin = 5;
  if(!Array.isArray(state.budgetAlerts)) state.budgetAlerts = [];
}
/* Convierte datos de eventos sociales creados con el modelo antiguo
   (un solo pagador, reparto siempre igual) al modelo nuevo, para no
   perder ni corromper datos ya guardados. */
function migrateData(){
  /* v2: los importes de movimientos se guardan siempre como número (algunos
     datos antiguos o importados podían venir como texto) y todo movimiento
     tiene campo note. Es idempotente: ejecutarla varias veces no cambia nada. */
  state.transactions.forEach(t=>{
    if(typeof t.amount!=="number") t.amount = Number(t.amount)||0;
    if(t.note===undefined) t.note = "";
  });
  /* Presupuesto mensual opcional por concepto de gasto (null = sin límite). */
  state.concepts.forEach(c=>{ if(c.budget===undefined) c.budget = null; });
  state.social.forEach(ev=>{
    if(ev.settlementTxId===undefined) ev.settlementTxId = null;
    ev.expenses.forEach(x=>{
      if(!x.payments){
        x.payments = [{participantId:x.paidBy, amountCents:toCents(x.amount)}];
        x.splitMode = x.splitMode || "equal";
        delete x.paidBy;
      }
    });
  });
}

/* ------------------------- bloqueo y desbloqueo --------------------------- */
/* Tres modos de la pantalla de bloqueo:
   - "vault": hay cofre cifrado → pedir frase de paso y descifrar.
   - "pin":   instalación antigua con PIN y datos sin cifrar → pedir PIN
              (en Inicio y Ajustes se recomienda activar el cifrado).
   - "setup": primera vez (sin cofre ni PIN) → crear la frase de paso; los
              datos nacen ya cifrados. */
function lockMode(){
  if(hasVault()) return "vault";
  if(localStorage.getItem(PIN_KEY)) return "pin";
  return "setup";
}

function initLock(){
  const mode = lockMode();
  const input = document.getElementById("pinInput");
  const confirmInput = document.getElementById("pinConfirm");
  const ack = document.getElementById("lockAck");
  const help = document.getElementById("lockHelp");
  const text = document.getElementById("lockText");
  input.value = ""; confirmInput.value = "";
  document.getElementById("lockError").textContent = "";
  if(mode==="pin"){
    text.textContent = "Introduce tu PIN.";
    input.setAttribute("inputmode","numeric"); input.placeholder = "••••"; input.autocomplete = "off";
    input.classList.add("pin-input");
    confirmInput.classList.add("hidden"); ack.classList.add("hidden");
    help.textContent = "El PIN solo bloquea la pantalla; tus datos no están cifrados. Puedes activar el cifrado en Ajustes.";
  }else{
    input.removeAttribute("inputmode"); input.classList.remove("pin-input");
    input.placeholder = "Frase de paso";
    if(mode==="vault"){
      text.textContent = "Introduce tu frase de paso para descifrar tus datos.";
      input.autocomplete = "current-password";
      confirmInput.classList.add("hidden"); ack.classList.add("hidden");
      help.textContent = "Tus datos están cifrados (AES-256) en este dispositivo. Sin la frase de paso no se pueden leer, ni siquiera por ti.";
    }else{
      text.textContent = "Crea una frase de paso. Con ella se cifrarán todos tus datos en este dispositivo.";
      input.autocomplete = "new-password";
      confirmInput.classList.remove("hidden"); ack.classList.remove("hidden");
      confirmInput.placeholder = "Repite la frase";
      help.textContent = "Mínimo 8 caracteres; mejor una frase de varias palabras que recuerdes. Puedes guardarla en el gestor de contraseñas del iPhone.";
    }
  }
  document.getElementById("lockScreen").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  input.focus();
}

/* Frena los intentos repetidos en la propia pantalla: 5 fallos → espera
   creciente (30 s, 60 s, 120 s…). La protección de fondo frente a quien
   copie el almacenamiento la da el cifrado, no esta espera. */
function lockThrottled(errorEl){
  if(Date.now() < (Roney._pinWaitUntil||0)){
    errorEl.textContent = `Demasiados intentos. Espera ${Math.ceil((Roney._pinWaitUntil-Date.now())/1000)} s.`;
    return true;
  }
  return false;
}
function registerFail(errorEl, msg){
  Roney._pinFails = (Roney._pinFails||0) + 1;
  if(Roney._pinFails % 5 === 0){
    Roney._pinWaitUntil = Date.now() + 30000 * Math.pow(2, Roney._pinFails/5 - 1);
  }
  errorEl.textContent = msg;
  document.getElementById("pinInput").value = "";
}

Roney.submitPin = async function(){
  if(Roney._unlocking) return;
  const mode = lockMode();
  const input = document.getElementById("pinInput");
  const val = mode==="pin" ? input.value.trim() : input.value;
  const errorEl = document.getElementById("lockError");
  const btn = document.getElementById("lockBtn");
  if(lockThrottled(errorEl)) return;

  if(mode==="pin"){
    if(val === localStorage.getItem(PIN_KEY)){ Roney._pinFails = 0; loadState(); unlockApp(); }
    else registerFail(errorEl, "PIN incorrecto.");
    return;
  }

  if(mode==="setup"){
    const problem = passphraseProblem(val);
    if(problem){ errorEl.textContent = problem; return; }
    if(val !== document.getElementById("pinConfirm").value){ errorEl.textContent = "Las dos frases no coinciden."; return; }
    if(!document.getElementById("lockAckCheck").checked){ errorEl.textContent = "Marca la casilla para confirmar que lo entiendes."; return; }
  }

  // WebCrypto solo existe en contexto seguro (https o localhost). Abierta
  // como archivo local no se puede cifrar ni descifrar.
  if(!(window.crypto && crypto.subtle)){
    errorEl.textContent = "Este navegador no permite cifrar aquí. Abre Roney desde su dirección https.";
    return;
  }
  // Derivar la clave tarda en torno a un segundo (a propósito): se avisa.
  Roney._unlocking = true; btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = mode==="setup" ? "Cifrando…" : "Descifrando…";
  errorEl.textContent = "";
  try{
    if(mode==="setup"){
      // Si hubiera datos sin cifrar de antes (sin PIN), se cifran también.
      loadState();
      await migrateToVault(val);
      Roney._pinFails = 0;
      unlockApp();
      toast("Cifrado activado.");
    }else{
      const env = readVault();
      if(!env){ errorEl.textContent = "No se pudo leer el cofre cifrado."; return; }
      try{
        const {key, salt, data} = await openWithPassphrase(env, val);
        vaultKey = key; vaultSalt = salt; vaultIter = env.iter;
        hydrateState(data);
        Roney._pinFails = 0;
        unlockApp();
      }catch(e){
        registerFail(errorEl, "Frase de paso incorrecta.");
      }
    }
  }catch(e){
    errorEl.textContent = (e && e.message) || "Error al cifrar los datos.";
  }finally{
    Roney._unlocking = false; btn.disabled = false; btn.textContent = oldLabel;
  }
};

function unlockApp(){
  document.getElementById("lockScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("pinInput").value="";
  document.getElementById("pinConfirm").value="";
  document.getElementById("lockError").textContent="";
  processRecurring();
  maybeGenerateMonthlyReport();
  checkBudgets();
  render();
}

/* Al bloquear en modo cofre se descartan la clave y los datos descifrados de
   la memoria: mientras está bloqueada, la app no tiene acceso a nada. Se
   espera a que termine cualquier guardado pendiente antes de soltar la clave. */
Roney.lockApp = async function(){
  document.getElementById("app").classList.add("hidden");
  if(vaultKey){
    await saveChain;
    vaultKey = null; vaultSalt = null;
    state = null;
    document.getElementById("main").innerHTML = "";
    ui.txForm = {}; ui.socialSelected = null; ui.settleFlow = null;
  }
  initLock();
};

/* ------------------------------- balances --------------------------------- */

function computeBalances(){
  const accBal = {}; state.accounts.forEach(a=>accBal[a.id]=0);
  const bunBal = {}; state.bundles.forEach(b=>bunBal[b.id]=0);
  for(const t of state.transactions){
    const amt = Number(t.amount)||0;
    if(t.kind==="ingreso"){
      if(t.medium==="cuenta"){
        accBal[t.accountId] = (accBal[t.accountId]||0) + amt;
        if(t.ingresoTipo==="efectivo" && t.sourceBundleId){
          bunBal[t.sourceBundleId] = (bunBal[t.sourceBundleId]||0) - amt;
        }
      }else{
        bunBal[t.bundleId] = (bunBal[t.bundleId]||0) + amt;
      }
    }else if(t.kind==="gasto"){
      if(t.medium==="cuenta") accBal[t.accountId] = (accBal[t.accountId]||0) - amt;
      else bunBal[t.bundleId] = (bunBal[t.bundleId]||0) - amt;
    }else if(t.kind==="transferencia"){
      if(t.transferType==="cuenta"){
        accBal[t.fromId] = (accBal[t.fromId]||0) - amt;
        accBal[t.toId] = (accBal[t.toId]||0) + amt;
      }else{
        bunBal[t.fromId] = (bunBal[t.fromId]||0) - amt;
        bunBal[t.toId] = (bunBal[t.toId]||0) + amt;
      }
    }
  }
  const totalCuentas = Object.values(accBal).reduce((s,v)=>s+v,0);
  const totalEfectivo = Object.values(bunBal).reduce((s,v)=>s+v,0);
  return {accBal, bunBal, totalCuentas, totalEfectivo, total: totalCuentas+totalEfectivo};
}

function goalCurrent(g){ return (g.contributions||[]).reduce((s,c)=>s+c.amount,0); }
function computeReserved(type, id){
  if(!id) return 0;
  return state.goals.reduce((s,g)=>{
    if(g.linkedType===type && g.linkedId===id) return s + Math.max(0, goalCurrent(g));
    return s;
  }, 0);
}
function computeAvailable(type, id){
  const {accBal, bunBal} = computeBalances();
  const bal = type==="cuenta" ? (accBal[id]||0) : (bunBal[id]||0);
  const reserved = computeReserved(type, id);
  return {bal, reserved, disponible: bal - reserved};
}

function conceptName(id){ const c = state.concepts.find(x=>x.id===id); return c ? c.name : "Sin concepto"; }
function conceptColor(id){ const c = state.concepts.find(x=>x.id===id); return c ? c.color : "#9AA3AD"; }
function accName(id){ return state.accounts.find(a=>a.id===id)?.alias || "—"; }
function bunName(id){ return state.bundles.find(b=>b.id===id)?.name || "—"; }
function ensureEventConcept(name, kind){
  let c = state.concepts.find(x=>x.name===name && x.kind===kind);
  if(!c){ c = {id:uid(), name, color:SOCIAL_CONCEPT_COLOR, kind}; state.concepts.push(c); }
  return c.id;
}
function sumMonth(list, mk){ return list.filter(t=>monthKey(t.date)===mk).reduce((s,t)=>s+Number(t.amount),0); }

/* ---------------------- recurrentes, suscripciones, informe ------------------- */

/* Meses que un recurrente tiene pendientes de procesar a fecha "todayIso".
   Antes solo se miraba el mes actual: si no abrías la app en todo un mes,
   ese mes se perdía sin aviso. Ahora se recuperan los meses intermedios
   (hasta 12, para no generar avalanchas tras mucho tiempo sin abrir la app).
   Función pura → probada en tests/test_v2.js. */
function pendingRecurringMonths(r, todayIso){
  const cur = monthKey(todayIso);
  const day = Number(todayIso.slice(8,10));
  const dueThisMonth = day >= r.dayOfMonth;
  const out = [];
  if(!r.lastHandledMonth){
    if(dueThisMonth) out.push(cur);
    return out;
  }
  let mk = addMonths(r.lastHandledMonth, 1);
  while(mk < cur && out.length < 12){ out.push(mk); mk = addMonths(mk, 1); }
  if(mk===cur && dueThisMonth && r.lastHandledMonth < cur) out.push(cur);
  return out.slice(-12);
}
function recurringTx(r, mk){
  return {
    id:uid(), kind:r.kind, medium:r.medium, amount:Number(r.amount),
    date:`${mk}-${String(r.dayOfMonth).padStart(2,"0")}`,
    conceptId:r.conceptId, accountId:r.accountId, bundleId:r.bundleId,
    ingresoTipo:r.ingresoTipo, sourceBundleId:r.sourceBundleId, note:r.note||"", recurringId:r.id,
  };
}
function processRecurring(){
  const today = todayISO();
  let changed = false;
  state.recurring.filter(r=>r.active).forEach(r=>{
    const months = pendingRecurringMonths(r, today);
    if(months.length===0) return;
    changed = true;
    months.forEach(mk=>{
      const label = `${MONTHS[monthNumOf(mk+"-01")]} ${mk.slice(0,4)}`;
      if(r.autoConfirm){
        state.transactions.unshift(recurringTx(r, mk));
        addNotification({type:"recurrente", title:`Movimiento recurrente registrado`, body:`${conceptName(r.conceptId)} · ${eur(r.amount)} (${r.kind}) añadido automáticamente para ${label}.`});
      }else{
        addNotification({type:"recurrente_pendiente", title:`Confirmar movimiento: ${conceptName(r.conceptId)}`,
          body:`¿Registrar ${eur(r.amount)} de ${r.kind==='ingreso'?'ingreso':'gasto'} correspondiente a ${label}?`,
          data:{recurringId:r.id, monthKey:mk}, needsAction:true});
      }
    });
    r.lastHandledMonth = months[months.length-1];
  });
  if(changed) saveState();
}

function detectSubscriptions(){
  const gastos = state.transactions.filter(t=>t.kind==="gasto");
  const groups = {};
  gastos.forEach(t=>{
    const key = t.conceptId + "_" + Math.round(Number(t.amount));
    if(!groups[key]) groups[key] = {key, conceptId:t.conceptId, amount:Number(t.amount), months:new Set(), count:0};
    groups[key].months.add(monthKey(t.date));
    groups[key].count++;
  });
  const nowKey = monthKey(todayISO());
  const recentMonths = [0,1,2,3].map(k=>addMonths(nowKey,-k));
  return Object.values(groups)
    /* Una suscripción se cobra una vez al mes: si el mismo importe aparece
       varias veces en un mes (p. ej. compras de supermercado de ~25 €), es
       coincidencia, no una suscripción. */
    .filter(g => recentMonths.filter(m=>g.months.has(m)).length >= 3 && g.count === g.months.size)
    .map(g => ({key:g.key, name:conceptName(g.conceptId), color:conceptColor(g.conceptId), amount:g.amount, months:g.months.size}))
    .sort((a,b)=>b.amount-a.amount);
}

function maybeGenerateMonthlyReport(){
  const nowKey = monthKey(todayISO());
  const targetMonth = addMonths(nowKey, -1);
  const already = state.notifications.some(n=>n.type==="informe" && n.data && n.data.month===targetMonth);
  if(already) return;
  const hasData = state.transactions.some(t=>monthKey(t.date)===targetMonth);
  if(!hasData) return;

  const gastos = state.transactions.filter(t=>t.kind==="gasto");
  const ingresos = state.transactions.filter(t=>t.kind==="ingreso" && !(t.medium==="cuenta" && t.ingresoTipo==="efectivo"));
  const gastoMes = sumMonth(gastos, targetMonth);
  const mesPrevio = addMonths(targetMonth, -1);
  const gastoMesPrevio = sumMonth(gastos, mesPrevio);
  const mesNum = monthNumOf(targetMonth+"-01");
  const yearPrevKey = `${Number(yearOf(targetMonth+"-01"))-1}-${String(mesNum+1).padStart(2,"0")}`;
  const gastoAnioPasado = sumMonth(gastos, yearPrevKey);
  const ingresoMes = sumMonth(ingresos, targetMonth);
  const ahorro = ingresoMes - gastoMes;

  const diffPrevio = gastoMesPrevio ? gastoMes-gastoMesPrevio : null;
  const diffAnio = gastoAnioPasado ? gastoMes-gastoAnioPasado : null;

  let body = `Gasto total: ${eur(gastoMes)}.`;
  if(diffPrevio!==null) body += ` ${diffPrevio>=0?'+':''}${eurShort(diffPrevio)} respecto al mes anterior (${eur(gastoMesPrevio)}).`;
  if(diffAnio!==null) body += ` ${diffAnio>=0?'+':''}${eurShort(diffAnio)} respecto a ${MONTHS[mesNum]} del año pasado (${eur(gastoAnioPasado)}).`;
  body += ` Ingresos: ${eur(ingresoMes)}. Ahorro neto del mes: ${eur(ahorro)}.`;

  addNotification({type:"informe", title:`Informe de ${MONTHS[mesNum]}`, body, data:{month:targetMonth}});
  // Avisos de variaciones destacadas del mes cerrado (como mucho 3).
  detectAnomalies(targetMonth).slice(0,3).forEach(x=>addNotification({type:"variacion",
    title:`${x.name}: +${Math.round(x.pct)} % sobre tu media`,
    body:`En ${MONTHS[mesNum]} gastaste ${eur(x.cur)} en ${x.name}, frente a una media de ${eur(x.avg)} en los 3 meses anteriores.`}));
  saveState();
}

/* ------------------------------ presupuestos ------------------------------ */

/* Gasto por concepto en un mes y su estado frente al presupuesto. Solo
   conceptos de gasto con budget > 0. Función pura salvo la lectura de
   state → probada en tests/test_v2.js. */
function computeBudgetStatus(mk){
  const spent = {};
  state.transactions.forEach(t=>{
    if(t.kind==="gasto" && monthKey(t.date)===mk) spent[t.conceptId] = (spent[t.conceptId]||0) + t.amount;
  });
  return state.concepts
    .filter(c=>c.kind==="gasto" && c.budget>0)
    .map(c=>{
      const s = Math.round((spent[c.id]||0)*100)/100;
      const pct = s / c.budget * 100;
      return {id:c.id, name:c.name, color:c.color, budget:c.budget, spent:s, pct,
        level: pct>=100 ? "over" : pct>=80 ? "warn" : "ok"};
    })
    .sort((a,b)=>b.pct-a.pct);
}
/* Emite un aviso (una sola vez por concepto, mes y nivel) al alcanzar el
   80 % y al superar el 100 % del presupuesto del mes en curso. */
function checkBudgets(){
  const mk = monthKey(todayISO());
  let changed = false;
  computeBudgetStatus(mk).forEach(b=>{
    if(b.level==="ok") return;
    const key = `${mk}|${b.id}|${b.level}`;
    if(state.budgetAlerts.includes(key)) return;
    state.budgetAlerts.push(key);
    changed = true;
    addNotification(b.level==="over"
      ? {type:"presupuesto", title:`Presupuesto superado: ${b.name}`, body:`Llevas ${eur(b.spent)} de ${eur(b.budget)} este mes (${Math.round(b.pct)} %).`}
      : {type:"presupuesto", title:`Presupuesto al ${Math.round(b.pct)} %: ${b.name}`, body:`Llevas ${eur(b.spent)} de ${eur(b.budget)}. Quedan ${eur(b.budget-b.spent)} para el resto del mes.`});
  });
  // Solo se conservan las claves de los últimos meses para que la lista no crezca sin fin.
  const keep = addMonths(mk, -2);
  state.budgetAlerts = state.budgetAlerts.filter(k=>k.slice(0,7) >= keep);
  if(changed){ saveState(); renderNav(); }
}
Roney.setBudget = function(conceptId, input){
  const c = state.concepts.find(x=>x.id===conceptId);
  if(!c) return;
  const raw = input.value.trim();
  if(raw===""){ c.budget = null; saveState(); toast("Presupuesto quitado."); return; }
  const v = parseAmount(raw);
  if(!(v>0)){ toast("Presupuesto no válido."); input.value = c.budget ? String(c.budget).replace(".", ",") : ""; return; }
  c.budget = v;
  saveState(); checkBudgets();
  toast(`Presupuesto de ${c.name}: ${eur(v)}/mes.`);
};

/* --------------------------- bloqueo automático --------------------------- */

/* Al pasar la app a segundo plano se anota la hora; al volver, si ha pasado
   más tiempo del configurado, se bloquea. Es lo que hace cualquier app
   bancaria. En modo cofre, bloquear además descarta de la memoria la clave
   y los datos descifrados (ver Roney.lockApp). */
let hiddenAt = null;
function setupAutoLock(){
  document.addEventListener("visibilitychange", ()=>{
    if(!state) return;
    const appVisible = !document.getElementById("app").classList.contains("hidden");
    if(document.visibilityState==="hidden"){ if(appVisible) hiddenAt = Date.now(); return; }
    const min = Number(state.settings.autoLockMin);
    if(hiddenAt && appVisible && min>=0 && Date.now()-hiddenAt >= min*60000) Roney.lockApp();
    else if(hiddenAt && appVisible){
      // Si se reabre otro día sin bloquear, procesar recurrentes e informe.
      processRecurring(); maybeGenerateMonthlyReport(); checkBudgets(); render();
    }
    hiddenAt = null;
  });
}
Roney.setAutoLock = function(v){ state.settings.autoLockMin = Number(v); saveState(); toast("Preferencia guardada."); };

/* -------------------------------- Inicio ----------------------------------- */

function renderInicio(){
  const {accBal, bunBal, totalCuentas, totalEfectivo, total} = computeBalances();
  const nowKey = monthKey(todayISO());
  const monthTx = state.transactions.filter(t=>monthKey(t.date)===nowKey);
  const ingresosMes = monthTx.filter(t=>t.kind==="ingreso" && !isInternalIncome(t)).reduce((s,t)=>s+Number(t.amount),0);
  const gastosMes = monthTx.filter(t=>t.kind==="gasto").reduce((s,t)=>s+Number(t.amount),0);
  const ahorroMes = ingresosMes - gastosMes;
  const recent = [...state.transactions].sort((a,b)=> a.date<b.date ? 1 : a.date>b.date ? -1 : 0).slice(0,5);

  const budgets = computeBudgetStatus(nowKey);
  const budgetsCard = budgets.length===0 ? "" : `
    <div class="card">
      <div class="row" style="margin-bottom:6px;"><div class="label">Presupuestos del mes</div>
        <button class="btn small ghost" onclick="Roney.goTab('ajustes')">Editar</button></div>
      ${budgets.map(b=>`
        <div style="margin-bottom:9px;">
          <div class="row" style="font-size:13px;margin-bottom:4px;">
            <span style="display:flex;align-items:center;gap:6px;min-width:0;"><span class="dot" style="background:${b.color};"></span><span class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(b.name)}</span></span>
            <span class="num" style="flex:0 0 auto;color:${b.level==='over'?'var(--danger)':b.level==='warn'?'var(--cash)':'var(--muted)'};">${eur(b.spent)} / ${eur(b.budget)}</span>
          </div>
          <div class="meter"><div class="meter-fill" style="width:${Math.min(100,b.pct)}%;background:${b.level==='over'?'var(--danger)':b.level==='warn'?'var(--cash)':'var(--income)'};"></div></div>
        </div>`).join("")}
    </div>`;

  /* Recordatorio de copia de seguridad: los datos solo viven en este
     dispositivo, así que si hace más de 30 días (o nunca) que se exportan
     y ya hay datos que perder, se avisa en Inicio. */
  const last = state.settings.lastBackup;
  const needBackup = state.transactions.length>=10 && (!last || daysBetween(last, todayISO())>30);
  const backupReminder = !needBackup ? "" : `
    <div class="card" style="border-color:var(--cash);">
      <div style="font-size:14px;font-weight:600;">Haz una copia de seguridad</div>

        </div>
        ${balanceCell("efectivo", b.id, bunBal[b.id]||0)}
      </div>`),
  ].join("");

  return `
    <div class="card">
      <div class="label">Patrimonio total</div>
      <div class="big num">${eur(total)}</div>
      <div class="stack" style="margin-top:14px;">
        <div>
          <div class="row" style="margin-bottom:5px;font-size:13px;"><span class="muted">Cuentas bancarias</span><span class="num">${eur(totalCuentas)}</span></div>
          <div class="meter"><div class="meter-fill" style="width:${pctC}%;background:var(--primary);"></div></div>
        </div>
        <div>
          <div class="row" style="margin-bottom:5px;font-size:13px;"><span class="muted">Efectivo</span><span class="num">${eur(totalEfectivo)}</span></div>
          <div class="meter"><div class="meter-fill" style="width:${pctE}%;background:var(--cash);"></div></div>
        </div>
      </div>
    </div>

    <div class="quick-row">
      <button class="quick-btn" onclick="Roney.quickAction('ingreso')"><span class="quick-ico" style="background:var(--income);">

      <button class="quick-btn" onclick="Roney.quickAction('gasto')"><span class="quick-ico" style="background:var(--expense);">

        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2.4"><path d="M7 7h13M7 7l-4 4M7 7l-4-4"/><path d="M17 17H4M17 17l4 4M17 17l4-4"/></svg></span>Transferir</button>
    </div>

    ${vaultKey ? "" : `
    <div class="card" style="border-color:var(--danger);">
      <div style="font-size:14px;font-weight:600;">Tus datos no están cifrados</div>

      <button class="btn small primary" style="margin-top:8px;" onclick="Roney.goTab('ajustes')">Activar cifrado</button>
    </div>`}

Roney.addAccount = function(){

  const bank = document.getElementById("newAccBank").value.trim();
  if(!alias || !bank){ toast("Rellena nombre en clave y banco."); return; }
  state.accounts.push({id:uid(), alias, bank, isDefault:false});
  saveState(); ui.forms.acc=false; render();
};
Roney.removeAccount = function(id){
  const acc = state.accounts.find(a=>a.id===id);
  if(acc && acc.isDefault){ toast("La cuenta principal no se puede eliminar."); return; }
  showConfirm("¿Eliminar esta cuenta y sus movimientos asociados? Esta acción no se puede deshacer.", () => {
    state.accounts = state.accounts.filter(a=>a.id!==id);
    state.transactions = state.transactions.filter(t =>
      t.accountId!==id &&
      !(t.kind==="transferencia" && t.transferType==="cuenta" && (t.fromId===id || t.toId===id))
    );
    cleanupLinks("cuenta", id);
    saveState(); render();
    toast("Cuenta eliminada.");
  });
};
/* Al borrar una cuenta o fajo, quedaban recurrentes apuntando a un id
   inexistente (generaban movimientos "huérfanos" cada mes) y metas
   vinculadas que seguían "apartando" dinero de algo que ya no existe.
   Los recurrentes se eliminan y las metas pasan a no vinculadas
   (conservan su historial de aportaciones). */
function cleanupLinks(type, id){
  const field = type==="cuenta" ? "accountId" : "bundleId";
  state.recurring = state.recurring.filter(r=>!(r.medium===type && r[field]===id));
  state.goals.forEach(g=>{ if(g.linkedType===type && g.linkedId===id){ g.linkedType=null; g.linkedId=null; } });
}
Roney.addBundle = function(){
  const name = document.getElementById("newBunName").value.trim();
  const objetivo = document.getElementById("newBunObj").value.trim();
  if(!name){ toast("Ponle un nombre al fajo."); return; }
  state.bundles.push({id:uid(), name, objetivo, isDefault:false});
  saveState(); ui.forms.bun=false; render();
};
Roney.removeBundle = function(id){
  const b = state.bundles.find(x=>x.id===id);
  if(b && b.isDefault){ toast("El fajo principal no se puede eliminar."); return; }
  showConfirm("¿Eliminar este fajo y sus movimientos asociados? Esta acción no se puede deshacer.", () => {
    state.bundles = state.bundles.filter(x=>x.id!==id);
    state.transactions = state.transactions.filter(t =>
      t.bundleId!==id && t.sourceBundleId!==id &&
      !(t.kind==="transferencia" && t.transferType==="efectivo" && (t.fromId===id || t.toId===id))
    );
    cleanupLinks("efectivo", id);
    saveState(); render();
    toast("Fajo eliminado.");
  });
};

/* ------------------------------ Movimientos --------------------------------- */

/* Al cambiar tipo/medio el formulario se vuelve a dibujar entero. Antes se
   perdía lo ya escrito (importe, fecha...); ahora se guarda en ui.txForm
   antes de redibujar y se usa como valor inicial. */
function captureTxForm(){
  const f = ui.txForm;
  const map = {txAmount:"amountRaw", txDate:"date", txNote:"note", txConcept:"conceptId", txAccount:"accountId",
    txBundle:"bundleId", txSourceBundle:"sourceBundleId", txFrom:"fromId", txTo:"toId"};
  Object.entries(map).forEach(([id,key])=>{ const el=document.getElementById(id); if(el) f[key]=el.value; });
}
Roney.setTxKind = function(k){ captureTxForm(); if(ui.txForm.kind!==k) ui.txForm.conceptId = undefined; ui.txForm.kind = k; render(); };
Roney.setTxMedium = function(m){ captureTxForm(); ui.txForm.medium = m; render(); };
Roney.setTxIngresoTipo = function(t){ captureTxForm(); ui.txForm.ingresoTipo = t; render(); };
Roney.setTxTransferType = function(t){ captureTxForm(); ui.txForm.transferType = t; ui.txForm.fromId = ui.txForm.toId = undefined; render(); };
Roney.toggleNewConcept = function(){ captureTxForm(); ui.txForm.newConcept = !ui.txForm.newConcept; render(); };
Roney.setTxFilter = function(f){ ui.txFilter = f; ui.txLimit = TX_PAGE; refreshTxList(); };
Roney.setTxMonth = function(m){ ui.txMonth = m; ui.txLimit = TX_PAGE; refreshTxList(); };
/* La búsqueda solo redibuja la lista (no el formulario) para que el campo
   no pierda el foco ni se cierre el teclado en cada pulsación. */
Roney.setTxSearch = function(v){ ui.txSearch = v; ui.txLimit = TX_PAGE; refreshTxList(); };
Roney.moreTx = function(){ ui.txLimit = (ui.txLimit||TX_PAGE) + TX_PAGE; refreshTxList(); };
function refreshTxList(){
  const el = document.getElementById("txList");
  if(el) el.innerHTML = renderTxList(); else render();
  const tabs = document.getElementById("txTabs");
  if(tabs) tabs.innerHTML = renderTxTabs();
}
const TX_PAGE = 60;

Roney.editTx = function(id){
  const t = state.transactions.find(x=>x.id===id);
  if(!t) return;
  ui.txForm = {
    editId:id, kind:t.kind, medium:t.medium, ingresoTipo:t.ingresoTipo, transferType:t.transferType,
    amountRaw:String(t.amount).replace(".", ","), date:t.date, note:t.note||"", conceptId:t.conceptId,
    accountId:t.accountId, bundleId:t.bundleId, sourceBundleId:t.sourceBundleId, fromId:t.fromId, toId:t.toId,
  };
  ui.tab = "movimientos";
  render(); window.scrollTo(0,0);

Roney.cancelEditTx = function(){ ui.txForm = {}; render(); };

/* Comprueba que un movimiento no deja una cuenta/fajo por debajo de lo
   apartado para metas. Devuelve el mensaje de error o null. Solo se aplica
   cuando hay dinero apartado (si no, se permiten saldos negativos, que
   pueden reflejar un descubierto real). */
function availabilityError(tx){
  let type, id;
  if(tx.kind==="transferencia"){ type = tx.transferType; id = tx.fromId; }
  else if(tx.kind==="gasto"){ type = tx.medium; id = tx.medium==="cuenta" ? tx.accountId : tx.bundleId; }
  else if(tx.kind==="ingreso" && tx.medium==="cuenta" && tx.ingresoTipo==="efectivo"){ type = "efectivo"; id = tx.sourceBundleId; }
  else return null;
  const av = computeAvailable(type, id);
  if(av.reserved>0 && tx.amount > av.disponible + 0.001){
    const label = type==="cuenta" ? accName(id) : bunName(id);
    return `Solo hay ${eur(av.disponible)} disponibles en ${label} (${eur(av.reserved)} apartados para metas).`;
  }
  return null;
}

Roney.submitTx = function(){
  captureTxForm();
  const f = ui.txForm;
  const kind = f.kind || "gasto";
  const date = f.date || todayISO();
  const amount = parseAmount(f.amountRaw);
  const note = (f.note||"").trim();
  if(!(amount>0)){ toast("Indica un importe válido (p. ej. 12,50)."); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast("Fecha no válida."); return; }

  let tx;
  let newConcept = null;
  if(kind==="transferencia"){
    const transferType = f.transferType || "cuenta";
    if(!f.fromId || !f.toId){ toast("Selecciona origen y destino."); return; }
    if(f.fromId===f.toId){ toast("Origen y destino no pueden ser el mismo."); return; }
    tx = {kind:"transferencia", transferType, amount, date, note, fromId:f.fromId, toId:f.toId};
  }else{
    const medium = f.medium || "cuenta";
    let conceptId = f.conceptId;
    if(f.newConcept){
      const name = (document.getElementById("newConceptName")?.value || "").trim();
      const color = document.getElementById("newConceptColor")?.value || "#2F6FED";
      if(!name){ toast("Ponle nombre al nuevo concepto."); return; }
      const existing = state.concepts.find(c=>c.kind===kind && c.name.toLowerCase()===name.toLowerCase());
      if(existing) conceptId = existing.id;
      else { newConcept = {id:uid(), name, color, kind, budget:null}; conceptId = newConcept.id; }
    }
    if(!conceptId){ toast("Elige o crea un concepto."); return; }
    tx = {kind, medium, amount, date, note, conceptId};
    if(medium==="cuenta"){
      if(!f.accountId){ toast("Selecciona una cuenta."); return; }
      tx.accountId = f.accountId;
      if(kind==="ingreso"){
        tx.ingresoTipo = f.ingresoTipo || "nuevo";
        if(tx.ingresoTipo==="efectivo"){
          if(!f.sourceBundleId){ toast("Selecciona el fajo de origen."); return; }
          tx.sourceBundleId = f.sourceBundleId;
        }
      }
    }else{
      if(!f.bundleId){ toast("Selecciona un fajo de efectivo."); return; }
      tx.bundleId = f.bundleId;
    }
  }

  // En edición, el movimiento original se retira temporalmente para que el
  // control de "disponible" no lo cuente dos veces.
  const idx = f.editId ? state.transactions.findIndex(t=>t.id===f.editId) : -1;
  const old = idx>=0 ? state.transactions.splice(idx, 1)[0] : null;
  const err = availabilityError(tx);
  if(err){ if(old) state.transactions.splice(idx, 0, old); toast(err); return; }

  if(newConcept) state.concepts.push(newConcept);
  if(old){
    tx.id = old.id;
    if(old.recurringId) tx.recurringId = old.recurringId;
    state.transactions.splice(idx, 0, tx);
  }else{
    tx.id = uid();
    state.transactions.unshift(tx);
  }
  saveState();
  checkBudgets();
  // Se conservan tipo, medio y fecha para registrar varios seguidos más rápido.
  ui.txForm = old ? {} : {kind, medium:f.medium, transferType:f.transferType, date: date!==todayISO() ? date : undefined};
  render();
  toast(old ? "Movimiento actualizado." : (kind==="transferencia" ? "Transferencia registrada." : "Movimiento registrado."));
};

/* Borrado con «Deshacer» en lugar de diálogo de confirmación: es más rápido
   en el uso diario y igual de seguro, porque se puede revertir durante
   unos segundos. */
Roney.removeTx = function(id){
  const idx = state.transactions.findIndex(t=>t.id===id);
  if(idx<0) return;
  const [removed] = state.transactions.splice(idx, 1);
  if(ui.txForm.editId===id) ui.txForm = {};
  saveState(); render();
  toast("Movimiento eliminado.", {label:"Deshacer", fn:()=>{
    state.transactions.splice(Math.min(idx, state.transactions.length), 0, removed);
    saveState(); render();
  }});
};

/* Texto en el que se busca: concepto, nota, cuentas, fecha e importe (con
   coma y con punto, para encontrar "12,5" o "12.5"). */
function txSearchText(t){
  const parts = [t.note, t.date, String(t.amount), String(t.amount).replace(".", ",")];
  if(t.kind==="transferencia"){
    const nm = t.transferType==="cuenta" ? accName : bunName;
    parts.push("transferencia", nm(t.fromId), nm(t.toId));
  }else{
    parts.push(conceptName(t.conceptId), t.medium==="cuenta" ? accName(t.accountId) : bunName(t.bundleId));
  }
  return parts.join(" ").toLowerCase();
}
function filteredTx(){
  const filter = ui.txFilter || "todos";
  const month = ui.txMonth || "todos";
  const q = (ui.txSearch||"").trim().toLowerCase();
  return state.transactions
    .filter(t=>filter==="todos" || t.kind===filter)
    .filter(t=>month==="todos" || monthKey(t.date)===month)
    .filter(t=>!q || txSearchText(t).includes(q))
    // Orden estable: misma fecha → se mantiene el orden de inserción.
    .sort((a,b)=> a.date<b.date ? 1 : a.date>b.date ? -1 : 0);
}
function txRow(t){
  const actions = `
    <button class="icon-btn" onclick="Roney.editTx('${t.id}')" aria-label="Editar movimiento">${pencilIcon()}</button>
    <button class="icon-btn" onclick="Roney.removeTx('${t.id}')" aria-label="Eliminar movimiento">${trashIcon()}</button>`;
  const noteHtml = t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : "";
  if(t.kind==="transferencia"){
    const nm = t.transferType==="cuenta" ? accName : bunName;
    return `
      <div class="list-item">
        <div class="item-left tx-main">
          <span class="dot" style="background:var(--primary);"></span>
          <div class="tx-main">
            <div class="t1">Transferencia</div>
            <div class="muted-2" style="font-size:12px;">${fmtDate(t.date)} · ${escapeHtml(nm(t.fromId))} → ${escapeHtml(nm(t.toId))}</div>
            ${noteHtml}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:2px;flex:0 0 auto;">
          <span class="num" style="color:var(--primary);font-weight:600;margin-right:4px;">${eur(t.amount)}</span>${actions}
        </div>
      </div>`;
  }
  return `
    <div class="list-item">
      <div class="item-left tx-main">
        <span class="dot" style="background:${conceptColor(t.conceptId)};"></span>
        <div class="tx-main">
          <div class="t1">${escapeHtml(conceptName(t.conceptId))}${t.recurringId?' <span class="badge">recurrente</span>':''}</div>
          <div class="muted-2" style="font-size:12px;">${fmtDate(t.date)} · ${t.medium==='cuenta'?escapeHtml(accName(t.accountId)):escapeHtml(bunName(t.bundleId))}${t.ingresoTipo==='efectivo'?` ← ${escapeHtml(bunName(t.sourceBundleId))}`:''}</div>
          ${noteHtml}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:2px;flex:0 0 auto;">
        <span class="num" style="color:${t.kind==='ingreso'?'var(--income)':'var(--expense)'};font-weight:600;margin-right:4px;">${t.kind==='ingreso'?'+':'−'}${eur(t.amount)}</span>${actions}
      </div>
    </div>`;
}
function renderTxList(){
  const list = filteredTx();
  if(list.length===0){
    return state.transactions.length===0
      ? '<div class="empty">Sin movimientos todavía. Registra el primero con el formulario de arriba.</div>'
      : '<div class="empty">Ningún movimiento coincide con los filtros.</div>';
  }
  const limit = ui.txLimit || TX_PAGE;
  const shown = list.slice(0, limit);
  // Totales por mes calculados sobre la lista filtrada completa, no solo
  // sobre lo mostrado, para que la cabecera de cada mes sea correcta.
  const totals = {};
  list.forEach(t=>{
    const mk = monthKey(t.date);
    totals[mk] = totals[mk] || {in:0, out:0};
    if(t.kind==="ingreso" && !isInternalIncome(t)) totals[mk].in += t.amount;
    if(t.kind==="gasto") totals[mk].out += t.amount;
  });
  let html = "", lastMk = null;
  shown.forEach(t=>{
    const mk = monthKey(t.date);
    if(mk!==lastMk){
      const tt = totals[mk];
      html += `<div class="month-head"><span>${MONTHS[monthNumOf(mk+"-01")]} ${mk.slice(0,4)}</span>
        <span class="num"><span style="color:var(--income);">+${eur(tt.in)}</span> · <span style="color:var(--expense);">−${eur(tt.out)}</span></span></div>`;
      lastMk = mk;
    }
    html += txRow(t);
  });
  if(list.length > limit){
    html += `<button class="btn block" style="margin-top:10px;" onclick="Roney.moreTx()">Ver más (${list.length-limit} restantes)</button>`;
  }
  return html;
}
function renderTxTabs(){
  const filter = ui.txFilter || "todos";
  return ["todos:Todos","ingreso:Ingresos","gasto:Gastos","transferencia:Transferencias"].map(x=>{
    const [k,l] = x.split(":");
    return `<button class="btn small ${filter===k?'primary':''}" onclick="Roney.setTxFilter('${k}')">${l}</button>`;
  }).join("");
}
/* Ingreso "interno": paso de efectivo propio a cuenta. No es dinero nuevo,
   así que no debe contar como ingreso del mes. */
function isInternalIncome(t){ return t.kind==="ingreso" && t.medium==="cuenta" && t.ingresoTipo==="efectivo"; }

function optionList(items, selected){
  return items.map(i=>`<option value="${i.id}" ${i.id===selected?'selected':''}>${escapeHtml(i.label)}</option>`).join("");
}

function renderMovimientos(){
  const f = ui.txForm;

    const items = transferType==="cuenta" ? state.accounts.map(a=>({id:a.id,label:a.alias})) : state.bundles.map(b=>({id:b.id,label:b.name}));
    // Destino por defecto distinto del origen: antes ambos selectores
    // empezaban en el mismo elemento y el primer intento siempre fallaba.

    const toSel = f.toId || (items.find(i=>i.id!==fromSel)?.id);
    form = `
      <div class="stack">

        ${items.length<2 ? `<div class="empty" style="color:var(--danger);">Necesitas al menos dos ${transferType==='cuenta'?'cuentas':'fajos'} para transferir entre ellos. Créalos en «Cuentas».</div>` : `
        <div class="grid2">
          <label class="field">Origen<select id="txFrom">${optionList(items, fromSel)}</select></label>
          <label class="field">Destino<select id="txTo">${optionList(items, toSel)}</select></label>
        </div>
        ${amountDate}${noteField}
        <button class="btn primary block" onclick="Roney.submitTx()">${editing?'Guardar cambios':'Registrar transferencia'}</button>`}
      </div>`;
  }else{
    const concepts = state.concepts.filter(c=>c.kind===kind);
    const conceptOptions = optionList(concepts.map(c=>({id:c.id,label:c.name})), f.conceptId);
    const accountOptions = optionList(state.accounts.map(a=>({id:a.id,label:`${a.alias} · ${a.bank}`})), f.accountId);
    const bundleOptions = optionList(state.bundles.map(b=>({id:b.id,label:b.name})), f.bundleId);
    const srcOptions = optionList(state.bundles.map(b=>({id:b.id,label:b.name})), f.sourceBundleId);
    form = `
      <div class="stack">
        ${editHead}${seg}
        ${amountDate}
        <label class="field">Concepto
          <select id="txConcept" ${f.newConcept?'disabled':''}>${conceptOptions || '<option value="">Sin conceptos</option>'}</select>
        </label>
        <button class="btn ghost small" style="align-self:flex-start;padding-left:0;" onclick="Roney.toggleNewConcept()">${f.newConcept?'Usar concepto existente':'+ Crear concepto nuevo'}</button>
        ${f.newConcept ? `
          <div class="grid2">
            <label class="field">Nombre<input id="newConceptName" placeholder="p. ej. Suscripciones"></label>
            <label class="field">Color<input id="newConceptColor" type="color" value="#2F6FED" style="padding:4px;"></label>
          </div>` : ""}
        <div class="grid2">
          <label class="field">Medio
            <select onchange="Roney.setTxMedium(this.value)">
              <option value="cuenta" ${medium==='cuenta'?'selected':''}>Cuenta</option>
              <option value="efectivo" ${medium==='efectivo'?'selected':''}>Efectivo</option>
            </select>
          </label>
          ${medium==='cuenta'
            ? `<label class="field">Cuenta<select id="txAccount">${accountOptions}</select></label>`
            : `<label class="field">Fajo<select id="txBundle">${bundleOptions}</select></label>`}
        </div>
        ${kind==='ingreso' && medium==='cuenta' ? `
          <label class="field">Tipo de ingreso
            <select onchange="Roney.setTxIngresoTipo(this.value)">
              <option value="nuevo" ${ingresoTipo==='nuevo'?'selected':''}>Dinero nuevo (externo)</option>
              <option value="efectivo" ${ingresoTipo==='efectivo'?'selected':''}>Ingreso de efectivo propio</option>

      </div>`;

  // Meses con movimientos, para el selector de periodo.
  const months = [...new Set(state.transactions.map(t=>monthKey(t.date)))].sort().reverse();
  const monthSel = ui.txMonth || "todos";
  return `
    <div class="card">${form}</div>
    <div class="tabs" id="txTabs">${renderTxTabs()}</div>
    <div class="grid2">
      <input class="search" type="search" placeholder="Buscar…" value="${escapeHtml(ui.txSearch||'')}" oninput="Roney.setTxSearch(this.value)" aria-label="Buscar movimientos">

      </select>
    </div>
    <div class="card" id="txList">${renderTxList()}</div>
  `;
}
