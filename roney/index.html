function svgBarChart(data, opts){
  opts = opts || {};
  const width = opts.width || 320, height = opts.height || 170, color = opts.color || "#2F6FED";
  const colorFn = opts.colorFn;
  const max = Math.max(1, ...data.map(d=>d.value));
  const n = Math.max(1, data.length);
  const padding = 22, bottomPad = 28;
  const chartW = width - padding*2, chartH = height - padding - bottomPad;
  const gap = chartW/n, barW = Math.min(46, gap*0.55);
  let bars="";
  data.forEach((d,i)=>{
    const h = max>0 ? (d.value/max)*chartH : 0;
    const x = padding + i*gap + (gap-barW)/2;
    const y = padding + (chartH-h);
    const fill = colorFn ? colorFn(d,i) : color;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="${fill}"></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${height-bottomPad+16}" font-size="11" style="fill:var(--muted)" text-anchor="middle">${escapeHtml(d.name)}</text>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="10.5" style="fill:var(--text)" text-anchor="middle">${eurShort(d.value)}</text>`;
  });
  const baseline = `<line x1="${padding}" y1="${padding+chartH}" x2="${width-padding}" y2="${padding+chartH}" style="stroke:var(--border)"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${baseline}${bars}</svg>`;
}

function svgLineChart(data, opts){
  opts = opts || {};
  const width = opts.width || 320, height = opts.height || 170, color = opts.color || "#2F6FED";
  const max = Math.max(1, ...data.map(d=>d.value));
  const min = Math.min(0, ...data.map(d=>d.value));
  const n = data.length;
  const padding = 22, bottomPad = 28;
  const chartW = width - padding*2, chartH = height - padding - bottomPad;
  const stepX = n>1 ? chartW/(n-1) : 0;
  const pts = data.map((d,i)=>{
    const x = padding + (n===1 ? chartW/2 : stepX*i);
    const y = padding + chartH - ((d.value-min)/((max-min)||1))*chartH;
    return {x,y,...d};
  });
  const poly = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  let dots="", labels="";
  pts.forEach((p,i)=>{
    dots += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}"></circle>`;
    if(opts.sparse ? (i%opts.sparse===0 || i===pts.length-1) : true){
      labels += `<text x="${p.x.toFixed(1)}" y="${height-bottomPad+16}" font-size="11" style="fill:var(--muted)" text-anchor="middle">${escapeHtml(p.name)}</text>`;
      labels += `<text x="${p.x.toFixed(1)}" y="${(p.y-9).toFixed(1)}" font-size="10.5" style="fill:var(--text)" text-anchor="middle">${eurShort(p.value)}</text>`;
    }
  });
  const baseline = `<line x1="${padding}" y1="${padding+chartH}" x2="${width-padding}" y2="${padding+chartH}" style="stroke:var(--border)"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}"><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.2"/>${dots}${baseline}${labels}</svg>`;
}

function svgDonutChart(data){
  const size=150, r=52, cx=size/2, cy=size/2, strokeWidth=20;
  const circumference = 2*Math.PI*r;
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let offset=0;
  const circles = data.map(d=>{
    const frac = d.value/total;
    const len = frac*circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${strokeWidth}"
      stroke-dasharray="${len.toFixed(2)} ${(circumference-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
    return seg;
  }).join("");
  const centerText = `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="13" style="fill:var(--text)" font-weight="700">${eurShort(total)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">total</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="150" height="150">${circles}${centerText}</svg>`;
}

function truncateLabel(s, n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* Reparte los importes de "sources" entre "targets" en orden, igual que el
   algoritmo de liquidación de Social: no hay una correspondencia real entre
   una fuente de ingreso concreta y una categoría de gasto concreta (el
   dinero es fungible), así que esto es una asignación visual proporcional,
   no una trazabilidad real de qué euro fue a parar a dónde. */
function computeSankeyFlows(sources, targets){
  const s = sources.map(x=>({id:x.id, remaining:x.value}));
  const t = targets.map(x=>({id:x.id, remaining:x.value}));
  const flows = []; let i=0, j=0;
  while(i<s.length && j<t.length){
    const a=s[i], b=t[j];
    const amt = Math.min(a.remaining, b.remaining);
    if(amt>0.005) flows.push({from:a.id, to:b.id, amount:amt});
    a.remaining -= amt; b.remaining -= amt;
    if(a.remaining<=0.005) i++;
    if(b.remaining<=0.005) j++;
  }
  return flows;
}

function svgIncomeSankey(sources, targets){
  const width=340, nodeW=12, x0=88, x1=x0+nodeW, x2=170, x3=x2+nodeW;
  const gapPx=10, minH=20, plotH=210;

  /* Reparte la altura disponible proporcionalmente al valor, pero garantiza
     un mínimo por bloque para que el nombre y el importe siempre quepan sin
     solaparse con el bloque vecino. Los bloques "pequeños" se fijan a minH;
     el espacio restante se reparte proporcionalmente entre el resto. */
  function layout(list){
    const n = list.length;
    if(n===0) return [];
    const usable = Math.max(minH*n, plotH - gapPx*(n-1));
    const total = list.reduce((s,x)=>s+x.value,0) || 1;
    const rawScale = usable/total;
    const small = new Set(list.filter(x=>x.value*rawScale < minH).map(x=>x.id));
    let scale = rawScale;
    if(small.size>0 && small.size<n){
      const bigTotal = list.filter(x=>!small.has(x.id)).reduce((s,x)=>s+x.value,0) || 1;
      const remaining = usable - small.size*minH;
      if(remaining>0) scale = remaining/bigTotal;
    }
    let y=0;
    return list.map(x=>{
      const h = small.has(x.id) ? minH : Math.max(minH, x.value*scale);
      const node = {...x, y0:y, y1:y+h, h};
      y = node.y1 + gapPx;
      return node;
    });
  }
  const leftNodes = layout(sources), rightNodes = layout(targets);
  const leftMap={}, rightMap={};
  leftNodes.forEach(n=>leftMap[n.id]=n); rightNodes.forEach(n=>rightMap[n.id]=n);
  const leftTotal={}, rightTotal={};
  sources.forEach(s=>leftTotal[s.id]=s.value); targets.forEach(t=>rightTotal[t.id]=t.value);
  const leftCursor={}, rightCursor={};
  leftNodes.forEach(n=>leftCursor[n.id]=n.y0); rightNodes.forEach(n=>rightCursor[n.id]=n.y0);

  /* La franja de cada flujo ocupa, dentro de su bloque, la misma fracción
     que ese flujo representa sobre el total de ese bloque — así las
     franjas siempre encajan exactamente en el bloque, aunque este se haya
     ensanchado por el mínimo, sin dejar huecos ni solapes entre sí. */
  const flows = computeSankeyFlows(sources, targets);
  const midX = (x1+x2)/2;
  const OVERLAP = 0.35;
  let ribbons = "";
  flows.forEach(f=>{
    const lNode = leftMap[f.from], rNode = rightMap[f.to];
    const lFrac = f.amount / (leftTotal[f.from] || f.amount);
    const rFrac = f.amount / (rightTotal[f.to] || f.amount);
    const lh = lNode.h * lFrac, rh = rNode.h * rFrac;
    const ly0 = leftCursor[f.from]; const ly1 = ly0+lh; leftCursor[f.from]=ly1;
    const ry0 = rightCursor[f.to]; const ry1 = ry0+rh; rightCursor[f.to]=ry1;
    const a = (ly0-OVERLAP).toFixed(1), b=(ly1+OVERLAP).toFixed(1), c=(ry0-OVERLAP).toFixed(1), d2=(ry1+OVERLAP).toFixed(1);
    const color = leftMap[f.from].color;
    const d = `M${x1},${a} C${midX},${a} ${midX},${c} ${x2},${c} L${x2},${d2} C${midX},${d2} ${midX},${b} ${x1},${b} Z`;
    ribbons += `<path d="${d}" fill="${color}" opacity="0.32"></path>`;
  });

  let nodesSvg = "";
  leftNodes.forEach(n=>{
    const midY=(n.y0+n.y1)/2;
    nodesSvg += `<rect x="${x0}" y="${n.y0.toFixed(1)}" width="${nodeW}" height="${n.h.toFixed(1)}" fill="${n.color}" rx="2"></rect>`;
    nodesSvg += `<text x="${x0-6}" y="${(midY-2).toFixed(1)}" font-size="11" style="fill:var(--text)" text-anchor="end">${escapeHtml(truncateLabel(n.name,15))}</text>`;
    nodesSvg += `<text x="${x0-6}" y="${(midY+11).toFixed(1)}" font-size="9.5" style="fill:var(--muted)" text-anchor="end">${eurShort(n.value)}</text>`;
  });
  rightNodes.forEach(n=>{
    const midY=(n.y0+n.y1)/2;
    nodesSvg += `<rect x="${x3}" y="${n.y0.toFixed(1)}" width="${nodeW}" height="${n.h.toFixed(1)}" fill="${n.color}" rx="2"></rect>`;
    nodesSvg += `<text x="${x3+nodeW+6}" y="${(midY-2).toFixed(1)}" font-size="11" style="fill:var(--text)" text-anchor="start">${escapeHtml(truncateLabel(n.name,15))}</text>`;
    nodesSvg += `<text x="${x3+nodeW+6}" y="${(midY+11).toFixed(1)}" font-size="9.5" style="fill:var(--muted)" text-anchor="start">${eurShort(n.value)}</text>`;
  });

  const totalH = Math.max(leftNodes.length?leftNodes[leftNodes.length-1].y1:0, rightNodes.length?rightNodes[rightNodes.length-1].y1:0) + 10;
  return `<svg viewBox="0 0 ${width} ${totalH.toFixed(1)}" width="100%" height="${totalH.toFixed(1)}">${ribbons}${nodesSvg}</svg>`;
}

function groupTxByConcept(list){
  const map = {};
  list.forEach(t=>{
    const id = t.conceptId || "sin";
    if(!map[id]) map[id] = {id, name:conceptName(t.conceptId), color:conceptColor(t.conceptId), value:0};
    map[id].value += Number(t.amount);
  });
  return Object.values(map).sort((a,b)=>b.value-a.value);
}

/* ======================= Análisis: periodos y cálculos =======================
   Todo son funciones puras sobre state.transactions (probadas en
   tests/test_analytics.js). Se calculan en el dispositivo: no hay servidor. */

function round2(n){ return Math.round(n*100)/100; }
function daysInMonth(mk){ const [y,m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function monthLabel(mk, short){
  const n = MONTHS[monthNumOf(mk+"-01")];
  return short ? n.slice(0,3) : `${n} ${mk.slice(0,4)}`;
}
function monthsBetween(a, b){
  const out = []; let m = a;
  while(m <= b && out.length < 600){ out.push(m); m = addMonths(m, 1); }
  return out;
}
const DOW = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

const PERIODS = [["mes","Este mes"],["mesAnt","Mes anterior"],["3m","Últimos 3 meses"],["6m","Últimos 6 meses"],["12m","Últimos 12 meses"],["anio","Este año"]];
/* Traduce el periodo elegido a un rango de fechas [start, end] (ambas
   incluidas) y a la lista de meses que abarca. Un periodo "AAAA-MM" es un
   mes concreto. */
function periodRange(p, todayIso){
  const cur = monthKey(todayIso);
  let m0, m1;
  if(p==="mes"){ m0 = m1 = cur; }
  else if(p==="mesAnt"){ m0 = m1 = addMonths(cur, -1); }
  else if(/^(3|6|12)m$/.test(p)){ m0 = addMonths(cur, -(parseInt(p,10)-1)); m1 = cur; }
  else if(p==="anio"){ m0 = cur.slice(0,4)+"-01"; m1 = cur.slice(0,4)+"-12"; }
  else if(/^\d{4}-\d{2}$/.test(p)){ m0 = m1 = p; }
  else { m0 = m1 = cur; }
  const named = PERIODS.find(x=>x[0]===p);
  return {
    key:p, start:`${m0}-01`, end:`${m1}-${String(daysInMonth(m1)).padStart(2,"0")}`,
    months:monthsBetween(m0, m1),
    // Meses ya empezados (no se pintan meses futuros de "Este año").
    pastMonths:monthsBetween(m0, m1 < cur ? m1 : cur),
    label: named ? named[1] : monthLabel(m0), single: m0===m1, includesToday: todayIso>=`${m0}-01` && cur<=m1,
  };
}
function inRange(t, r){ return t.date>=r.start && t.date<=r.end; }

/* Ingresos, gastos y ahorro por mes. Los ingresos "internos" (efectivo
   propio ingresado en cuenta) no cuentan: no son dinero nuevo. */
function monthlySeries(months){
  const map = {};
  months.forEach(m=>map[m] = {mk:m, ingresos:0, gastos:0});
  state.transactions.forEach(t=>{
    const r = map[monthKey(t.date)];
    if(!r) return;
    if(t.kind==="ingreso" && !isInternalIncome(t)) r.ingresos += t.amount;
    else if(t.kind==="gasto") r.gastos += t.amount;
  });
  return months.map(m=>{
    const r = map[m];
    r.ingresos = round2(r.ingresos); r.gastos = round2(r.gastos); r.ahorro = round2(r.ingresos - r.gastos);
    return r;
  });
}

/* Efecto de un movimiento sobre los totales de cuentas (c) y efectivo (e).
   Mismas reglas que computeBalances(); las transferencias entre cuentas o
   entre fajos no cambian los totales. */
function txDelta(t){
  const a = t.amount;
  if(t.kind==="ingreso"){
    if(t.medium==="cuenta") return {c:a, e:(t.ingresoTipo==="efectivo" && t.sourceBundleId) ? -a : 0};
    return {c:0, e:a};
  }
  if(t.kind==="gasto") return t.medium==="cuenta" ? {c:-a, e:0} : {c:0, e:-a};
  return {c:0, e:0};
}
/* Patrimonio al cierre de cada mes, reconstruido acumulando todos los
   movimientos hasta esa fecha (no requiere guardar saldos históricos). */
function netWorthSeries(months){
  const sorted = [...state.transactions].sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  let c = 0, e = 0, i = 0;
  return months.map(m=>{
    const end = `${m}-31`;
    while(i < sorted.length && sorted[i].date <= end){ const d = txDelta(sorted[i]); c += d.c; e += d.e; i++; }
    return {mk:m, cuentas:round2(c), efectivo:round2(e), total:round2(c+e)};
  });
}

/* Importe mensual de un concepto en los meses indicados. */
function conceptMonthly(conceptId, months){
  const map = {}; months.forEach(m=>map[m]=0);
  state.transactions.forEach(t=>{
    if(t.conceptId===conceptId && (t.kind==="gasto" || t.kind==="ingreso") && map[monthKey(t.date)]!==undefined) map[monthKey(t.date)] += t.amount;
  });
  return months.map(m=>({mk:m, value:round2(map[m])}));
}

/* Gasto fijo = generado por un recurrente o que encaja con una suscripción
   detectada (mismo concepto e importe redondeado varios meses). */
function subscriptionKeys(){ return new Set(detectSubscriptions().map(s=>s.key)); }
function isFixedExpense(t, subs){
  return t.kind==="gasto" && (!!t.recurringId || subs.has(t.conceptId + "_" + Math.round(t.amount)));
}
function fixedVsVariable(list){
  const subs = subscriptionKeys();
  let fixed = 0, variable = 0; const fixedByConcept = {};
  list.forEach(t=>{
    if(t.kind!=="gasto") return;
    if(isFixedExpense(t, subs)){ fixed += t.amount; fixedByConcept[t.conceptId] = (fixedByConcept[t.conceptId]||0) + t.amount; }
    else variable += t.amount;
  });
  return {fixed:round2(fixed), variable:round2(variable),
    fixedList:Object.entries(fixedByConcept).map(([id,v])=>({id, name:conceptName(id), color:conceptColor(id), value:round2(v)})).sort((a,b)=>b.value-a.value)};
}

/* Previsión de cierre del mes en curso:
     fijo ya pagado + fijo pendiente (recurrentes de gasto activos que aún no
     se han registrado este mes) + gasto variable extrapolado linealmente
     (variable_hasta_hoy × días_del_mes / día_actual).
   Es una extrapolación simple, no un modelo predictivo: al principio de mes
   es muy sensible a un único gasto grande. */
function monthForecast(todayIso){
  const mk = monthKey(todayIso), d = Number(todayIso.slice(8,10)), D = daysInMonth(mk);
  const list = state.transactions.filter(t=>t.kind==="gasto" && monthKey(t.date)===mk && t.date<=todayIso);
  const fv = fixedVsVariable(list);
  const pendingFixed = round2(state.recurring
    .filter(r=>r.active && r.kind==="gasto" && !state.transactions.some(t=>t.recurringId===r.id && monthKey(t.date)===mk))
    .reduce((s,r)=>s+Number(r.amount), 0));
  const prev = monthlySeries([1,2,3].map(k=>addMonths(mk,-k))).filter(x=>x.gastos>0);
  const avg3 = prev.length ? round2(prev.reduce((s,x)=>s+x.gastos,0)/prev.length) : null;
  const budgetTotal = round2(state.concepts.filter(c=>c.kind==="gasto" && c.budget>0).reduce((s,c)=>s+c.budget,0));
  return {mk, day:d, days:D, spent:round2(fv.fixed+fv.variable), fixed:fv.fixed, variable:fv.variable, pendingFixed,
    projected:round2(fv.fixed + pendingFixed + fv.variable*D/d), avg3, budgetTotal};
}

/* Conceptos de gasto con una subida destacada en el mes mk respecto a la
   media de los 3 meses anteriores. Reglas (simples y explicables):
   - al menos 2 de esos 3 meses con gasto en el concepto,
   - media >= 20 € (evita porcentajes enormes sobre importes pequeños),
   - subida >= 40 % y >= 15 €. */
function detectAnomalies(mk){
  const prevMonths = [1,2,3].map(k=>addMonths(mk,-k));
  return state.concepts.filter(c=>c.kind==="gasto").map(c=>{
    const cur = conceptMonthly(c.id, [mk])[0].value;
    const prev = conceptMonthly(c.id, prevMonths).map(x=>x.value);
    const withData = prev.filter(v=>v>0).length;
    const avg = round2(prev.reduce((s,v)=>s+v,0)/3);
    return {id:c.id, name:c.name, color:c.color, cur, avg, withData, pct: avg>0 ? (cur-avg)/avg*100 : 0};
  }).filter(x=>x.withData>=2 && x.avg>=20 && x.pct>=40 && x.cur-x.avg>=15).sort((a,b)=>b.pct-a.pct);
}

/* Indicadores clave del periodo. */
function periodKpis(r, todayIso){
  const series = monthlySeries(r.pastMonths);
  const ingresos = round2(series.reduce((s,x)=>s+x.ingresos,0));
  const gastos = round2(series.reduce((s,x)=>s+x.gastos,0));
  const ahorro = round2(ingresos - gastos);
  const endEff = r.end < todayIso ? r.end : todayIso;
  const days = endEff >= r.start ? daysBetween(r.start, endEff) + 1 : 0;
  const cur = monthKey(todayIso);
  const last6 = monthlySeries([1,2,3,4,5,6].map(k=>addMonths(cur,-k))).filter(x=>x.gastos>0);
  const avgMonthly = last6.length ? round2(last6.reduce((s,x)=>s+x.gastos,0)/last6.length) : null;
  const patrimonio = computeBalances().total;
  const lastMk = r.pastMonths[r.pastMonths.length-1];
  return {
    ingresos, gastos, ahorro,
    tasa: ingresos>0 ? ahorro/ingresos*100 : null,
    days, diario: days>0 ? round2(gastos/days) : null,
    avgMonthly, patrimonio, colchon: avgMonthly ? patrimonio/avgMonthly : null,
    topRise: lastMk ? (detectAnomalies(lastMk)[0] || null) : null,
  };
}

/* Gasto diario de un mes (índice 0 = día 1) y nº de movimientos. */
function dailyExpenses(mk){
  const D = daysInMonth(mk);
  const days = Array.from({length:D}, ()=>({value:0, count:0}));
  state.transactions.forEach(t=>{
    if(t.kind==="gasto" && monthKey(t.date)===mk){ const d = days[Number(t.date.slice(8,10))-1]; if(d){ d.value += t.amount; d.count++; } }
  });
  days.forEach(d=>d.value = round2(d.value));
  return days;
}

/* Gasto del periodo por cuenta/fajo. */
function expensesByMedium(list){
  const map = {};
  list.forEach(t=>{
    if(t.kind!=="gasto") return;
    const key = t.medium==="cuenta" ? "c:"+t.accountId : "e:"+t.bundleId;
    if(!map[key]) map[key] = {key, type:t.medium, name: t.medium==="cuenta" ? accName(t.accountId) : bunName(t.bundleId), value:0};
    map[key].value += t.amount;
  });
  const items = Object.values(map).map(x=>({...x, value:round2(x.value)})).sort((a,b)=>b.value-a.value);
  return {items,
    cuenta: round2(items.filter(x=>x.type==="cuenta").reduce((s,x)=>s+x.value,0)),
    efectivo: round2(items.filter(x=>x.type!=="cuenta").reduce((s,x)=>s+x.value,0))};
}

/* ======================= Análisis: gráficos interactivos ======================
   Cada gráfico registra en chartTips un texto por elemento; al tocar una
   barra, punto, sector o día se muestra ese texto debajo del gráfico (sin
   redibujar la pantalla). Los colores van por variables CSS para respetar
   el modo oscuro. */
const chartTips = {};
function tipBox(chart, hint){ return `<div class="chart-tip" id="tip_${chart}">${hint || "Toca el gráfico para ver el detalle."}</div>`; }
function hit(chart, i){ return `data-chart="${chart}" data-i="${i}" onclick="Roney.anaTip('${chart}',${i})"`; }
Roney.anaTip = function(chart, i){
  const el = document.getElementById("tip_"+chart);
  if(!el || !chartTips[chart]) return;
  el.textContent = chartTips[chart][i] || "";
  document.querySelectorAll(`[data-chart="${chart}"]`).forEach(n=>n.classList.toggle("sel", n.dataset.i===String(i)));
};

/* Escala vertical común: devuelve y(v) para valores entre min y max. */
function yScale(min, max, top, bottom){
  const span = (max - min) || 1;
  return v => top + (max - v)/span*(bottom - top);
}

/* Barras de ingresos y gastos por mes + línea de ahorro neto. */
function svgMonthly(series, chart){
  const W = 340, H = 200, L = 6, R = 6, T = 12, B = 176;
  const n = Math.max(1, series.length);
  const max = Math.max(1, ...series.map(s=>Math.max(s.ingresos, s.gastos, s.ahorro)));
  const min = Math.min(0, ...series.map(s=>s.ahorro));
  const y = yScale(min, max, T, B);
  const gw = (W-L-R)/n, bw = Math.min(13, gw*0.3);
  let svg = "", pts = [];
  series.forEach((s,i)=>{
    const cx = L + gw*i + gw/2;
    svg += `<rect x="${(cx-bw-1).toFixed(1)}" y="${y(s.ingresos).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-y(s.ingresos)).toFixed(1)}" rx="2" style="fill:var(--income)"></rect>`;
    svg += `<rect x="${(cx+1).toFixed(1)}" y="${y(s.gastos).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(0)-y(s.gastos)).toFixed(1)}" rx="2" style="fill:var(--expense)"></rect>`;
    pts.push(`${cx.toFixed(1)},${y(s.ahorro).toFixed(1)}`);
    if(n<=6 || i%2===(n-1)%2) svg += `<text x="${cx.toFixed(1)}" y="${H-8}" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">${monthLabel(s.mk,true)}</text>`;
  });
  svg += `<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${W-R}" y2="${y(0).toFixed(1)}" style="stroke:var(--border-strong)"/>`;
  svg += `<polyline points="${pts.join(" ")}" fill="none" style="stroke:var(--primary)" stroke-width="2"/>`;
  series.forEach((s,i)=>{
    const cx = L + gw*i + gw/2;
    svg += `<circle cx="${cx.toFixed(1)}" cy="${y(s.ahorro).toFixed(1)}" r="3" style="fill:var(--primary)"></circle>`;
    // Zona táctil invisible de toda la columna: más fácil de acertar con el dedo.
    svg += `<rect class="hitcol" ${hit(chart,i)} x="${(L+gw*i).toFixed(1)}" y="0" width="${gw.toFixed(1)}" height="${B}" style="fill:transparent"></rect>`;
  });
  chartTips[chart] = series.map(s=>`${monthLabel(s.mk)}: ingresos ${eur(s.ingresos)} · gastos ${eur(s.gastos)} · ahorro ${eur(s.ahorro)}${s.ingresos>0?` (${Math.round(s.ahorro/s.ingresos*100)} %)`:""}`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos, gastos y ahorro por mes">${svg}</svg>
    <div class="chart-legend"><span><i style="background:var(--income)"></i>Ingresos</span><span><i style="background:var(--expense)"></i>Gastos</span><span><i style="background:var(--primary)"></i>Ahorro neto</span></div>`;
}

/* Línea de patrimonio total (área) y de cuentas/efectivo. */
function svgNetWorth(series, chart){
  const W = 340, H = 180, L = 8, R = 8, T = 18, B = 156;
  const n = series.length;
  const vals = series.flatMap(s=>[s.total, s.cuentas, s.efectivo]);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const y = yScale(min, max, T, B);
  const step = n>1 ? (W-L-R)/(n-1) : 0;
  const x = i => n===1 ? W/2 : L + step*i;
  const line = key => series.map((s,i)=>`${x(i).toFixed(1)},${y(s[key]).toFixed(1)}`).join(" ");
  let svg = `<polygon points="${x(0).toFixed(1)},${y(0).toFixed(1)} ${line("total")} ${x(n-1).toFixed(1)},${y(0).toFixed(1)}" style="fill:var(--primary);opacity:.12"></polygon>`;
  svg += `<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${W-R}" y2="${y(0).toFixed(1)}" style="stroke:var(--border-strong)"/>`;
  svg += `<polyline points="${line("cuentas")}" fill="none" style="stroke:var(--primary);opacity:.45" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  svg += `<polyline points="${line("efectivo")}" fill="none" style="stroke:var(--cash)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  svg += `<polyline points="${line("total")}" fill="none" style="stroke:var(--primary)" stroke-width="2.2"/>`;
  series.forEach((s,i)=>{
    svg += `<circle ${hit(chart,i)} cx="${x(i).toFixed(1)}" cy="${y(s.total).toFixed(1)}" r="4" style="fill:var(--primary)"></circle>`;
    if(n<=6 || i%2===(n-1)%2) svg += `<text x="${x(i).toFixed(1)}" y="${H-6}" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">${monthLabel(s.mk,true)}</text>`;
  });
  const last = series[n-1];
  svg += `<text x="${Math.min(x(n-1), W-R).toFixed(1)}" y="${(y(last.total)-9).toFixed(1)}" font-size="11" font-weight="700" text-anchor="end" style="fill:var(--text)">${eurShort(last.total)}</text>`;
  const gw = n>1 ? step : W;
  series.forEach((s,i)=>{ svg += `<rect ${hit(chart,i)} x="${(x(i)-gw/2).toFixed(1)}" y="0" width="${gw.toFixed(1)}" height="${B}" style="fill:transparent"></rect>`; });
  chartTips[chart] = series.map((s,i)=>{
    const prev = i>0 ? series[i-1].total : null;
    return `Cierre de ${monthLabel(s.mk)}: ${eur(s.total)} (cuentas ${eur(s.cuentas)} · efectivo ${eur(s.efectivo)})${prev!==null?` · ${s.total-prev>=0?"+":""}${eur(s.total-prev)} vs. mes anterior`:""}`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del patrimonio">${svg}</svg>
    <div class="chart-legend"><span><i style="background:var(--primary)"></i>Total</span><span><i style="background:var(--primary);opacity:.45"></i>Cuentas</span><span><i style="background:var(--cash)"></i>Efectivo</span></div>`;
}

/* Barras simples interactivas. items: [{label, value, tip}] */
function svgBars(items, chart, color){
  const W = 340, H = 170, L = 6, R = 6, T = 18, B = 146;
  const n = Math.max(1, items.length);
  const max = Math.max(1, ...items.map(d=>d.value));
  const y = yScale(0, max, T, B);
  const gw = (W-L-R)/n, bw = Math.min(40, gw*0.6);
  let svg = "";
  items.forEach((d,i)=>{
    const cx = L + gw*i + gw/2;
    svg += `<rect ${hit(chart,i)} x="${(cx-bw/2).toFixed(1)}" y="${y(d.value).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,B-y(d.value)).toFixed(1)}" rx="3" style="fill:${color}"></rect>`;
    if(n<=8 || i%2===(n-1)%2) svg += `<text x="${cx.toFixed(1)}" y="${H-8}" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">${escapeHtml(d.label)}</text>`;
    if(n<=6 && d.value>0) svg += `<text x="${cx.toFixed(1)}" y="${(y(d.value)-5).toFixed(1)}" font-size="10" text-anchor="middle" style="fill:var(--text)">${eurShort(d.value)}</text>`;
    svg += `<rect ${hit(chart,i)} x="${(L+gw*i).toFixed(1)}" y="0" width="${gw.toFixed(1)}" height="${B}" style="fill:transparent"></rect>`;
  });
  svg += `<line x1="${L}" y1="${B}" x2="${W-R}" y2="${B}" style="stroke:var(--border-strong)"/>`;
  chartTips[chart] = items.map(d=>d.tip);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${svg}</svg>`;
}

/* Donut por concepto: cada sector abre el detalle del concepto. */
function svgDonutTap(data){
  const size = 150, r = 52, cx = 75, cy = 75, sw = 22;
  const C = 2*Math.PI*r, total = data.reduce((s,d)=>s+d.value,0) || 1;
  let off = 0;
  const segs = data.map(d=>{
    const len = d.value/total*C;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"
      ${d.id!=="sin" ? `onclick="Roney.anaConcept('${d.id}')" style="cursor:pointer"` : ""}></circle>`;
    off += len; return seg;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="150" height="150" role="img" aria-label="Gasto por concepto">${segs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--text)">${eurShort(total)}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">total</text></svg>`;
}

/* Mapa de calor del gasto diario de un mes (semana empieza en lunes). */
function renderHeatmap(mk){
  const days = dailyExpenses(mk);
  const max = Math.max(0, ...days.map(d=>d.value));
  const [y,m] = mk.split("-").map(Number);
  const lead = (new Date(y, m-1, 1).getDay() + 6) % 7;
  const head = ["L","M","X","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("");
  let cells = "";
  for(let i=0;i<lead;i++) cells += `<div></div>`;
  days.forEach((d,i)=>{
    // 5 niveles relativos al día de más gasto del mes.
    const lvl = d.value<=0 || max<=0 ? 0 : Math.min(4, Math.ceil(d.value/max*4));
    const bg = lvl ? `background:color-mix(in srgb, var(--expense) ${[0,18,38,60,85][lvl]}%, transparent);` : "";
    cells += `<button class="h" ${hit("heat",i)} style="${bg}${lvl>=3?"color:#fff;":""}" aria-label="Día ${i+1}: ${eur(d.value)}">${i+1}</button>`;
  });
  chartTips.heat = days.map((d,i)=>{
    const dow = DOW[new Date(y, m-1, i+1).getDay()];
    return `${dow.charAt(0).toUpperCase()+dow.slice(1)} ${i+1} de ${MONTHS[m-1]}: ${d.value>0 ? `${eur(d.value)} en ${d.count} gasto${d.count>1?"s":""}` : "sin gastos"}`;
  });
  // Gasto medio por día de la semana en este mes: deja ver patrones (fines de semana...).
  const byDow = Array.from({length:7}, ()=>({sum:0, n:0}));
  days.forEach((d,i)=>{ const w = (new Date(y, m-1, i+1).getDay()+6)%7; byDow[w].sum += d.value; byDow[w].n++; });
  const avgDow = byDow.map(x=>x.n ? x.sum/x.n : 0);
  const topDow = avgDow.indexOf(Math.max(...avgDow));
  const total = days.reduce((s,d)=>s+d.value,0);
  return `<div class="heat">${head}${cells}</div>
    ${tipBox("heat", "Toca un día para ver lo que gastaste.")}
    ${total>0 ? `<p class="helper">Día de la semana con más gasto medio: <b>${["lunes","martes","miércoles","jueves","viernes","sábado","domingo"][topDow]}</b> (${eur(avgDow[topDow])} de media).</p>` : ""}`;
}

/* ============================ Análisis: pantalla ============================ */

function anaState(){ if(!ui.ana) ui.ana = {period:"mes", concept:null}; return ui.ana; }
Roney.setAnaPeriod = function(v){ anaState().period = v; ui.ana.concept = null; render(); };
Roney.anaConcept = function(id){ anaState().concept = id; render(); window.scrollTo(0,0); };
Roney.anaBack = function(){ anaState().concept = null; render(); };

function kpiTile(label, value, sub, color){
  return `<div class="kpi"><div class="label" style="font-size:12px;">${label}</div><div class="v num" ${color?`style="color:${color}"`:""}>${value}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
}

function renderConceptDetail(conceptId, r){
  const c = state.concepts.find(x=>x.id===conceptId);
  if(!c){ ui.ana.concept = null; return renderAnalisis(); }
  const cur = monthKey(todayISO());
  const months = monthsBetween(addMonths(cur, -11), cur);
  const series = conceptMonthly(c.id, months);
  const withData = series.filter(s=>s.value>0);
  const avg = withData.length ? round2(withData.reduce((s,x)=>s+x.value,0)/withData.length) : 0;
  const total12 = round2(series.reduce((s,x)=>s+x.value,0));
  const list = state.transactions.filter(t=>t.conceptId===c.id && inRange(t, r)).sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const periodTotal = round2(list.reduce((s,t)=>s+t.amount,0));
  const color = c.kind==="gasto" ? "var(--expense)" : "var(--income)";
  return `
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="icon-btn" onclick="Roney.anaBack()" aria-label="Volver"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="dot" style="background:${c.color};"></span><h2 style="font-size:18px;">${escapeHtml(c.name)}</h2>
    </div>
    <div class="kpis">
      ${kpiTile(r.label, eur(periodTotal), `${list.length} movimiento${list.length===1?"":"s"}`)}
      ${kpiTile("Media mensual", eur(avg), `en los ${withData.length} meses con ${c.kind} (últimos 12)`)}
      ${kpiTile("Últimos 12 meses", eur(total12), "")}
      ${c.budget ? kpiTile("Presupuesto", eur(c.budget)+"/mes", avg>c.budget ? "tu media lo supera" : "tu media está por debajo", avg>c.budget?"var(--danger)":"") : kpiTile("Presupuesto", "—", "puedes fijarlo en Ajustes")}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">Evolución (12 meses)</h3>
      ${svgBars(series.map(s=>({label:monthLabel(s.mk,true), value:s.value, tip:`${monthLabel(s.mk)}: ${eur(s.value)}${avg>0&&s.value>0?` (${s.value>=avg?"+":""}${Math.round((s.value-avg)/avg*100)} % vs. media)`:""}`})), "concept", color)}
      ${tipBox("concept")}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">Movimientos · ${escapeHtml(r.label.toLowerCase())}</h3>
      ${list.length ? list.slice(0,100).map(txRow).join("") : '<div class="empty">Sin movimientos de este concepto en el periodo.</div>'}
      ${list.length>100 ? `<p class="helper">Se muestran los 100 más recientes.</p>` : ""}
    </div>`;
}

function renderAnalisis(){
  const a = anaState();
  const today = todayISO();
  const r = periodRange(a.period, today);
  if(state.transactions.length===0){
    return `<div class="card"><div class="empty">Registra ingresos y gastos en «Movimientos» para ver tus análisis aquí.</div></div>`;
  }
  const monthsWithData = [...new Set(state.transactions.map(t=>monthKey(t.date)))].sort().reverse();
  const selector = `
    <div class="card" style="padding:12px;">
      <div class="row" style="gap:8px;">
        <select class="search" style="flex:1;" onchange="Roney.setAnaPeriod(this.value)" aria-label="Periodo de análisis">
          ${PERIODS.map(([k,l])=>`<option value="${k}" ${a.period===k?"selected":""}>${l}</option>`).join("")}
          <optgroup label="Mes concreto">
            ${monthsWithData.map(m=>`<option value="${m}" ${a.period===m?"selected":""}>${monthLabel(m)}</option>`).join("")}
          </optgroup>
        </select>
        <button class="btn small" style="flex:0 0 auto;" onclick="Roney.exportPeriodReport()">Exportar</button>
      </div>
      <div class="muted-2" style="font-size:12px;margin-top:6px;">${fmtDate(r.start)} – ${fmtDate(r.end)}</div>
    </div>`;
  if(a.concept) return selector + renderConceptDetail(a.concept, r);

  const list = state.transactions.filter(t=>inRange(t, r));
  const gastos = list.filter(t=>t.kind==="gasto");
  const ingresos = list.filter(t=>t.kind==="ingreso" && !isInternalIncome(t));
  const k = periodKpis(r, today);
  const cur = monthKey(today);

  // KPIs (punto 7)
  const kpis = `
    <div class="kpis">
      ${kpiTile("Ahorro neto", eur(k.ahorro), k.tasa!==null ? `tasa de ahorro ${Math.round(k.tasa)} %` : "sin ingresos en el periodo", k.ahorro>=0?"var(--income)":"var(--expense)")}
      ${kpiTile("Gasto medio diario", k.diario!==null?eur(k.diario):"—", k.days ? `${eur(k.gastos)} en ${k.days} día${k.days>1?"s":""}` : "periodo aún no empezado")}
      ${kpiTile("Meses de colchón", k.colchon!==null ? (k.colchon<0?"0":k.colchon.toFixed(1).replace(".",",")) : "—", k.avgMonthly ? `patrimonio ${eurShort(k.patrimonio)} / gasto medio ${eurShort(k.avgMonthly)}/mes` : "faltan meses completos con gastos", k.colchon!==null && k.colchon<3 ? "var(--cash)" : "")}
      ${k.topRise ? kpiTile("Mayor subida", escapeHtml(k.topRise.name), `+${Math.round(k.topRise.pct)} % sobre su media (${eur(k.topRise.cur)} vs. ${eur(k.topRise.avg)})`, "var(--expense)") : kpiTile("Mayor subida", "—", "ningún concepto se dispara respecto a su media")}
    </div>
    <p class="helper" style="margin-top:-6px;">Meses de colchón: cuántos meses podrías cubrir tus gastos habituales solo con tu patrimonio actual. Una referencia habitual para un fondo de emergencia es 3–6 meses.</p>`;

  // Ritmo y previsión del mes (punto 5)
  let forecast = "";
  if(r.includesToday){
    const f = monthForecast(today);
    const ref = f.avg3;
    const pctMes = Math.round(f.day/f.days*100);
    forecast = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Ritmo de ${MONTHS[monthNumOf(today)]}</h3>
      <div class="row" style="font-size:13px;"><span class="muted">Llevas gastado (día ${f.day} de ${f.days})</span><span class="num" style="font-weight:700;">${eur(f.spent)}</span></div>
      <div class="row" style="font-size:13px;margin-top:4px;"><span class="muted">Previsión de cierre</span><span class="num" style="font-weight:700;color:${ref && f.projected>ref*1.1 ? "var(--expense)" : "var(--text)"};">${eur(f.projected)}</span></div>
      ${ref ? `<div class="row" style="font-size:13px;margin-top:4px;"><span class="muted">Tu media (3 meses anteriores)</span><span class="num">${eur(ref)}</span></div>` : ""}
      ${f.budgetTotal ? `<div class="row" style="font-size:13px;margin-top:4px;"><span class="muted">Suma de presupuestos</span><span class="num">${eur(f.budgetTotal)}</span></div>` : ""}
      <div class="meter" style="margin-top:10px;position:relative;">
        <div class="meter-fill" style="width:${ref ? Math.min(100, f.spent/Math.max(ref, f.projected)*100) : pctMes}%;background:var(--expense);"></div>
      </div>
      <p class="helper">Cálculo: gasto fijo ya pagado (${eur(f.fixed)}) + recurrentes aún pendientes este mes (${eur(f.pendingFixed)}) + gasto variable extrapolado al ritmo actual (${eur(f.variable)} en ${f.day} días). Es una extrapolación lineal: a principios de mes un solo gasto grande la distorsiona mucho.</p>
    </div>`;
  }

  // Evolución mensual (punto 2): los meses del periodo, o los 12 meses que
  // terminan en él si el periodo es un único mes.
  const evoMonths = r.single ? monthsBetween(addMonths(r.months[0], -11), r.months[0] < cur ? r.months[0] : cur) : r.pastMonths;
  const evo = monthlySeries(evoMonths);
  const evoCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">Ingresos, gastos y ahorro por mes</h3>
      ${svgMonthly(evo, "evo")}
      ${tipBox("evo")}
    </div>`;

  // Patrimonio (punto 3)
  const nwMonths = r.single ? evoMonths : monthsBetween(addMonths(evoMonths[evoMonths.length-1], -Math.max(11, evoMonths.length-1)), evoMonths[evoMonths.length-1]);
  const nw = netWorthSeries(nwMonths);
  const nwCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">Evolución del patrimonio</h3>
      <p class="helper" style="margin-top:0;">Saldo total al cierre de cada mes, reconstruido a partir de tus movimientos. Si empezaste a usar Roney con dinero ya ahorrado y no lo registraste como ingreso inicial, la curva arranca más baja que la realidad.</p>
      ${svgNetWorth(nw, "nw")}
      ${tipBox("nw")}
    </div>`;

  // Sankey del periodo
  let sankeySources = groupTxByConcept(ingresos), sankeyTargets = groupTxByConcept(gastos), sankeyNote = "";
  if(sankeySources.length && sankeyTargets.length){
    const diff = sankeySources.reduce((s,x)=>s+x.value,0) - sankeyTargets.reduce((s,x)=>s+x.value,0);
    if(diff > 0.01) sankeyTargets = [...sankeyTargets, {id:"__ahorro__", name:"Ahorro", color:"#17A673", value:diff}];
    else if(diff < -0.01){
      sankeySources = [...sankeySources, {id:"__diferencia__", name:"Diferencia (no viene de ingresos)", color:"#9AA3AD", value:-diff}];
      sankeyNote = "En este periodo gastaste más de lo que ingresaste; esa diferencia aparece como origen aparte solo para que el diagrama cuadre: salió de ahorros previos, no de un ingreso.";
    }
  }
  const sankeyCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">De dónde vino y a dónde fue</h3>
      <p class="helper" style="margin-top:0;">Diagrama de Sankey: a la izquierda los ingresos, a la derecha los gastos. La unión entre un ingreso concreto y un gasto concreto es solo visual (el dinero es fungible).</p>
      ${(sankeySources.length && sankeyTargets.length) ? svgIncomeSankey(sankeySources, sankeyTargets) : '<div class="empty">Necesitas al menos un ingreso y un gasto en el periodo.</div>'}
      ${sankeyNote ? `<p class="helper" style="color:var(--expense);">${sankeyNote}</p>` : ""}
    </div>`;

  // Donut con detalle por concepto (punto 4)
  const byConcept = groupTxByConcept(gastos);
  const totalG = byConcept.reduce((s,d)=>s+d.value,0) || 1;
  const donutCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">Gasto por concepto</h3>
      ${byConcept.length ? `
      <div class="donut-wrap" style="margin-top:8px;">
        ${svgDonutTap(byConcept)}
        <div class="legend">${byConcept.map(d=>`
          <div class="legend-row ${d.id!=="sin"?"tap":""}" ${d.id!=="sin"?`onclick="Roney.anaConcept('${d.id}')"`:""}>
            <span style="display:flex;align-items:center;gap:6px;min-width:0;"><span class="dot" style="background:${d.color};"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(d.name)}</span></span>
            <span class="num muted" style="flex:0 0 auto;">${eurShort(d.value)} · ${Math.round(d.value/totalG*100)}%</span>
          </div>`).join("")}</div>
      </div>
      <p class="helper">Toca un concepto para ver su evolución y sus movimientos.</p>` : '<div class="empty">Sin gastos en el periodo.</div>'}
    </div>`;

  // Fijo vs variable (punto 6)
  const fv = fixedVsVariable(gastos);
  const fvTotal = fv.fixed + fv.variable;
  const fvCard = fvTotal<=0 ? "" : `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Gasto fijo y variable</h3>
      <div class="row" style="font-size:13px;margin-bottom:4px;"><span class="muted">Fijo · ${Math.round(fv.fixed/fvTotal*100)} %</span><span class="num">${eur(fv.fixed)}</span></div>
      <div class="row" style="font-size:13px;margin-bottom:6px;"><span class="muted">Variable · ${Math.round(fv.variable/fvTotal*100)} %</span><span class="num">${eur(fv.variable)}</span></div>
      <div class="meter" style="display:flex;"><div class="meter-fill" style="width:${fv.fixed/fvTotal*100}%;background:var(--primary);"></div><div class="meter-fill" style="width:${fv.variable/fvTotal*100}%;background:var(--cash);"></div></div>
      ${fv.fixedList.length ? `<div style="margin-top:8px;">${fv.fixedList.map(x=>`<div class="kv"><span style="display:flex;align-items:center;gap:6px;min-width:0;"><span class="dot" style="background:${x.color};"></span>${escapeHtml(x.name)}</span><span class="num">${eur(x.value)}</span></div>`).join("")}</div>` : ""}
      <p class="helper">Fijo = movimientos generados por un recurrente o que coinciden con una suscripción detectada. El variable es el margen real que decides cada mes.</p>
    </div>`;

  // Mapa de calor (punto 8)
  const heatMk = r.single ? r.months[0] : cur;
  const heatCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:8px;">Gasto por día · ${monthLabel(heatMk)}</h3>
      ${renderHeatmap(heatMk)}
    </div>`;

  // Variaciones destacadas (punto 9)
  const anomMk = r.pastMonths[r.pastMonths.length-1] || cur;
  const anomalies = detectAnomalies(anomMk);
  const anomCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">Variaciones destacadas · ${monthLabel(anomMk)}</h3>
      <p class="helper" style="margin-top:0;">Conceptos que suben al menos un 40 % (y 15 €) sobre su media de los 3 meses anteriores.</p>
      ${anomalies.length ? anomalies.map(x=>`
        <div class="list-item tap" onclick="Roney.anaConcept('${x.id}')">
          <span style="display:flex;align-items:center;gap:8px;min-width:0;"><span class="dot" style="background:${x.color};"></span><span class="t1">${escapeHtml(x.name)}</span></span>
          <span class="num" style="color:var(--expense);flex:0 0 auto;">+${Math.round(x.pct)} % · ${eur(x.cur)} <span class="muted-2">vs. ${eur(x.avg)}</span></span>
        </div>`).join("") : '<div class="empty">Nada fuera de lo normal respecto a tus meses anteriores.</div>'}
    </div>`;

  // Por medio de pago (punto 10)
  const bm = expensesByMedium(gastos);
  const bmTotal = bm.cuenta + bm.efectivo;
  const mediumCard = bmTotal<=0 ? "" : `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Gasto por medio de pago</h3>
      <div class="row" style="font-size:13px;margin-bottom:6px;"><span class="muted">Cuenta ${Math.round(bm.cuenta/bmTotal*100)} % · Efectivo ${Math.round(bm.efectivo/bmTotal*100)} %</span></div>
      ${bm.items.map(x=>`
        <div style="margin-bottom:8px;">
          <div class="row" style="font-size:13px;margin-bottom:3px;"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(x.name)} <span class="muted-2">${x.type==="cuenta"?"cuenta":"efectivo"}</span></span><span class="num" style="flex:0 0 auto;">${eur(x.value)}</span></div>
          <div class="meter"><div class="meter-fill" style="width:${x.value/bm.items[0].value*100}%;background:${x.type==="cuenta"?"var(--primary)":"var(--cash)"};"></div></div>
        </div>`).join("")}
    </div>`;

  // Comparativas históricas (interactivas, punto 11)
  const allG = state.transactions.filter(t=>t.kind==="gasto");
  const refMonthNum = monthNumOf(anomMk+"-01");
  const sameMonth = {}, perYear = {};
  allG.forEach(t=>{
    const yv = yearOf(t.date);
    perYear[yv] = (perYear[yv]||0) + t.amount;
    if(monthNumOf(t.date)===refMonthNum) sameMonth[yv] = (sameMonth[yv]||0) + t.amount;
  });
  const smItems = Object.keys(sameMonth).sort().map(yv=>({label:yv, value:round2(sameMonth[yv]), tip:`${MONTHS[refMonthNum]} de ${yv}: ${eur(sameMonth[yv])}`}));
  const pyItems = Object.keys(perYear).sort().map(yv=>({label:yv, value:round2(perYear[yv]), tip:`Gasto total de ${yv}: ${eur(perYear[yv])}${yv===cur.slice(0,4)?" (año en curso)":""}`}));
  const histCard = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">${MONTHS[refMonthNum].charAt(0).toUpperCase()+MONTHS[refMonthNum].slice(1)} a lo largo de los años</h3>
      ${smItems.length>1 ? svgBars(smItems, "sm", "var(--primary)") + tipBox("sm") : '<div class="empty">Necesitas datos de ese mes en más de un año.</div>'}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">Gasto total por año</h3>
      ${svgBars(pyItems, "py", "var(--cash)")}
      ${tipBox("py")}
    </div>`;

  return selector + kpis + forecast + evoCard + nwCard + donutCard + fvCard + sankeyCard + heatCard + anomCard + mediumCard + histCard;
}

/* ============================ Análisis: exportar =========================== */
/* Informe de texto del periodo (punto 12), pensado para leerse o
   compartirse tal cual (Notas, correo...). */
function buildPeriodReport(r, todayIso){
  const list = state.transactions.filter(t=>inRange(t, r));
  const gastos = list.filter(t=>t.kind==="gasto");
  const k = periodKpis(r, todayIso);
  const L = [];
  L.push(`INFORME RONEY · ${r.label.toUpperCase()}`);
  L.push(`${fmtDate(r.start)} – ${fmtDate(r.end)} (generado el ${fmtDate(todayIso)})`, "");
  L.push(`Ingresos: ${eur(k.ingresos)}`, `Gastos: ${eur(k.gastos)}`, `Ahorro neto: ${eur(k.ahorro)}${k.tasa!==null?` (${Math.round(k.tasa)} % de los ingresos)`:""}`);
  if(k.diario!==null) L.push(`Gasto medio diario: ${eur(k.diario)}`);
  if(k.colchon!==null) L.push(`Meses de colchón: ${k.colchon.toFixed(1).replace(".",",")} (patrimonio ${eur(k.patrimonio)} / gasto medio ${eur(k.avgMonthly)} al mes)`);
  const fv = fixedVsVariable(gastos);
  if(fv.fixed+fv.variable>0) L.push(`Gasto fijo: ${eur(fv.fixed)} · variable: ${eur(fv.variable)}`);
  const byC = groupTxByConcept(gastos), tot = byC.reduce((s,d)=>s+d.value,0)||1;
  if(byC.length){ L.push("", "GASTO POR CONCEPTO"); byC.forEach(d=>L.push(`- ${d.name}: ${eur(d.value)} (${Math.round(d.value/tot*100)} %)`)); }
  const bm = expensesByMedium(gastos);
  if(bm.items.length){ L.push("", "GASTO POR MEDIO DE PAGO"); bm.items.forEach(x=>L.push(`- ${x.name} (${x.type}): ${eur(x.value)}`)); }
  const lastMk = r.pastMonths[r.pastMonths.length-1];
  const an = lastMk ? detectAnomalies(lastMk) : [];
  if(an.length){ L.push("", `VARIACIONES DESTACADAS (${monthLabel(lastMk)})`); an.forEach(x=>L.push(`- ${x.name}: ${eur(x.cur)}, +${Math.round(x.pct)} % sobre su media de ${eur(x.avg)}`)); }
  if(r.pastMonths.length>1){
    L.push("", "POR MES"); monthlySeries(r.pastMonths).forEach(s=>L.push(`- ${monthLabel(s.mk)}: ingresos ${eur(s.ingresos)} · gastos ${eur(s.gastos)} · ahorro ${eur(s.ahorro)}`));
  }
  L.push("", "Orientativo; no es asesoramiento financiero certificado.");
  return L.join("\n");
}
Roney.exportPeriodReport = function(){
  const r = periodRange(anaState().period, todayISO());
  const list = state.transactions.filter(t=>inRange(t, r));
  if(list.length===0){ toast("No hay movimientos en este periodo."); return; }
  const slug = r.key.replace(/[^0-9a-z-]/gi, "");
  const go = (kind) => kind==="txt"
    ? deliverFile(`roney_informe_${slug}_${todayISO()}.txt`, buildPeriodReport(r, todayISO()), "text/plain")
    : deliverFile(`roney_movimientos_${slug}_${todayISO()}.csv`, buildCSV(list), "text/csv");
  // Elección de formato con el diálogo propio (no hay prompt() nativo).
  showConfirm(`Exportar «${r.label}» (${list.length} movimientos). El informe es un resumen en texto; el CSV contiene los movimientos para Excel.${vaultKey?" Ninguno de los dos va cifrado.":""}`,
    ()=>go("txt"), {okLabel:"Informe (.txt)", safe:true, altLabel:"Movimientos (.csv)", onAlt:()=>go("csv")});
};

function computeAdaptiveSplit(){
  const gastos = state.transactions.filter(t=>t.kind==="gasto");
  const nowKey = monthKey(todayISO());
  const curMonthNum = monthNumOf(todayISO());

  const lastMonths = [1,2,3].map(k=>addMonths(nowKey,-k));
  const monthlySums = lastMonths
    .map(mk => ({mk, sum: gastos.filter(t=>monthKey(t.date)===mk).reduce((s,t)=>s+Number(t.amount),0), has: gastos.some(t=>monthKey(t.date)===mk)}))
    .filter(x=>x.has);
  const avgRecent = monthlySums.length ? monthlySums.reduce((a,b)=>a+b.sum,0)/monthlySums.length : null;

  const prevYearKey = `${Number(yearOf(todayISO()))-1}-${String(curMonthNum+1).padStart(2,"0")}`;
  const hasSameMonthLastYear = gastos.some(t=>monthKey(t.date)===prevYearKey);
  const sameMonthLastYear = hasSameMonthLastYear ? gastos.filter(t=>monthKey(t.date)===prevYearKey).reduce((s,t)=>s+Number(t.amount),0) : null;

  let referencia = null, fuente = "";
  if(avgRecent!==null && hasSameMonthLastYear){
    referencia = avgRecent*0.6 + sameMonthLastYear*0.4;
    fuente = `la media de gasto de los últimos ${monthlySums.length} mes(es) (${eur(avgRecent)}) y el gasto del mismo mes del año pasado (${eur(sameMonthLastYear)})`;
  }else if(avgRecent!==null){
    referencia = avgRecent;
    fuente = `la media de gasto de los últimos ${monthlySums.length} mes(es) (${eur(avgRecent)}), sin datos del mismo mes del año pasado`;
  }else if(hasSameMonthLastYear){
    referencia = sameMonthLastYear;
    fuente = `el gasto del mismo mes del año pasado (${eur(sameMonthLastYear)})`;
  }

  if(referencia===null || !state.monthlyIncome){
    return {split:null, info:"Necesitas indicar tu ingreso mensual (más abajo) y tener al menos un mes de gastos registrados para calcular un reparto adaptativo."};
  }

  let ratio = referencia / state.monthlyIncome;
  ratio = Math.max(0.35, Math.min(0.8, ratio));
  const esencial = Math.round(ratio*100);
  const remaining = 100 - esencial;
  const ahorro = Math.round(remaining*0.35);
  const inversion = Math.round(remaining*0.45);
  const discrecional = remaining - ahorro - inversion;

  return {
    split:{esencial, ahorro, inversion, discrecional},
    info:`Calculado a partir de ${fuente}, sobre un ingreso mensual de ${eur(state.monthlyIncome)}. Lo no destinado a gasto esencial se reparte con una ponderación fija (35% ahorro / 45% inversión / 20% discrecional). Es un cálculo por reglas simples, no un modelo predictivo: revísalo cada mes, no lo automatices sin mirar.`
  };
}

/* Entrega un archivo al usuario. En iPhone (PWA en pantalla de inicio) un
   <a download> con blob no siempre funciona: puede abrir una vista sin
   opción de guardar. Si el navegador permite compartir archivos (Web Share
   API, disponible en iOS 15+), se abre la hoja de compartir de iOS, desde
   la que se puede «Guardar en Archivos». Si no, se usa la descarga clásica. */
async function deliverFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  try{
    const file = new File([blob], filename, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return true;
    }
  }catch(e){
    if(e && e.name==="AbortError") return false; // el usuario cerró la hoja
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  return true;
}
/* Copia de seguridad. Con el cifrado activado, la copia se cifra con la
   misma clave del cofre (misma frase de paso; la sal y las iteraciones van
   dentro del archivo, así que se puede abrir en otro dispositivo con la
   frase). Sin cifrado activado, la copia va en claro y se avisa. */
Roney.exportData = async function(){
  const stamp = todayISO();
  let content, name;
  if(vaultKey){
    const enc = await encryptJSON(vaultKey, state);
    content = JSON.stringify({_app:"roney", _format:"roney-encrypted-v1", _exportedAt:new Date().toISOString(),
      v:1, kdf:"PBKDF2-SHA256", iter:vaultIter, salt:b64(vaultSalt), ...enc});
    name = `roney_backup_${stamp}_cifrado.json`;
  }else{
    content = JSON.stringify({...state, _app:"roney", _exportedAt:new Date().toISOString()}, null, 2);
    name = `roney_backup_${stamp}.json`;
  }
  const ok = await deliverFile(name, content, "application/json");
  if(ok){
    state.settings.lastBackup = stamp; saveState(); render();
    if(!vaultKey) toast("Copia exportada SIN cifrar. Activa el cifrado en Ajustes.");
  }
};
/* Exporta los movimientos a CSV (separador ";" y coma decimal, que es lo
   que espera Excel/Numbers configurado en español). El BOM inicial hace que
   Excel detecte UTF-8 y muestre bien las tildes. */
function buildCSV(list){
  const q = v => { const s = String(v ?? ""); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const num = n => (Number(n)||0).toFixed(2).replace(".", ",");
  const rows = [["Fecha","Tipo","Concepto","Importe","Medio","Cuenta/Fajo","Origen","Destino","Nota"]];
  [...(list || state.transactions)].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(t=>{
    if(t.kind==="transferencia"){
      const nm = t.transferType==="cuenta" ? accName : bunName;
      rows.push([t.date, "transferencia", "", num(t.amount), t.transferType, "", nm(t.fromId), nm(t.toId), t.note]);
    }else{
      const signed = t.kind==="gasto" ? -t.amount : t.amount;
      rows.push([t.date, t.kind, conceptName(t.conceptId), num(signed), t.medium,
        t.medium==="cuenta" ? accName(t.accountId) : bunName(t.bundleId),
        t.ingresoTipo==="efectivo" ? bunName(t.sourceBundleId) : "", "", t.note]);
    }
  });
  return "﻿" + rows.map(r=>r.map(q).join(";")).join("\r\n");
}
Roney.exportCSV = function(){
  if(state.transactions.length===0){ toast("No hay movimientos que exportar."); return; }
  const go = () => deliverFile(`roney_movimientos_${todayISO()}.csv`, buildCSV(), "text/csv");
  // Un CSV es texto plano por definición (Excel no abre archivos cifrados).
  if(vaultKey) showConfirm("El archivo CSV no va cifrado: cualquiera que lo tenga podrá leer tus movimientos. ¿Exportar igualmente?", go, {okLabel:"Exportar", safe:true});
  else go();
};

/* Revisión del contenido de un backup antes de importarlo. Además de la
   forma (listas presentes), comprueba que identificadores, fechas, colores
   y tipos tienen el formato que genera la propia app. Motivo: esos valores
   se insertan en el HTML (p. ej. onclick="Roney.removeTx('ID')" o
   style="background:COLOR"), así que un archivo manipulado con un id como
   x');alert(1);(' podría ejecutar código dentro de la app. Rechazarlo aquí
   cierra esa puerta para cualquier archivo que venga de fuera. */
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
const SAFE_DATE = /^\d{4}-\d{2}(-\d{2})?$/;
const SAFE_COLOR = /^#[0-9A-Fa-f]{3,8}$/;
const SAFE_ENUMS = {
  kind: ["ingreso","gasto","transferencia"], medium: ["cuenta","efectivo"], transferType: ["cuenta","efectivo"],
  ingresoTipo: ["nuevo","efectivo"], linkedType: ["cuenta","efectivo"], splitMode: ["equal","custom"], type: null,
};
function backupProblems(o){
  const problems = [];
  const walk = (v, path, key) => {
    if(problems.length > 5) return;
    if(Array.isArray(v)){
      v.forEach((x,i)=>walk(x, `${path}[${i}]`, key==="splitAmong" ? "id" : null));
      return;
    }
    if(v && typeof v==="object"){
      Object.entries(v).forEach(([k,x])=>{
        // Las claves de splitAmounts son ids de participantes.
        if(key==="splitAmounts" && !SAFE_ID.test(k)) problems.push(`${path}: identificador no válido`);
        walk(x, path ? `${path}.${k}` : k, k);
      });
      return;
    }
    if(v===null || v===undefined || key===null) return;
    if((key==="id" || /Id$/.test(key)) && !(typeof v==="string" && SAFE_ID.test(v))) problems.push(`${path}: identificador no válido`);
    else if(/^(date|dueDate|targetDate|createdAt|lastHandledMonth|monthKey|month|lastBackup)$/.test(key) && !(typeof v==="string" && SAFE_DATE.test(v))) problems.push(`${path}: fecha no válida`);
    else if(key==="color" && !(typeof v==="string" && SAFE_COLOR.test(v))) problems.push(`${path}: color no válido`);
    else if(SAFE_ENUMS[key] && !SAFE_ENUMS[key].includes(v)) problems.push(`${path}: valor no permitido`);
    else if(/^(amount|amountCents|targetAmount|budget|dayOfMonth|monthlyIncome|esencial|ahorro|inversion|discrecional)$/.test(key) && !(typeof v==="number" && isFinite(v)) && !(key==="amount" && typeof v==="string" && isFinite(Number(v)))) problems.push(`${path}: número no válido`);
  };
  walk(o, "", null);
  return problems;
}
/* Comprueba que un objeto tiene la forma mínima de un backup de Roney antes
   de sustituir los datos: evita que un JSON cualquiera deje la app rota. */
function validateBackup(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return "El archivo no contiene un objeto de datos.";
  const arrays = ["accounts","bundles","concepts","transactions"];
  for(const k of arrays){ if(!Array.isArray(o[k])) return `Falta la lista «${k}»: no parece un backup de Roney.`; }
  for(const k of ["social","recurring","notifications","goals","loans"]){
    if(o[k]!==undefined && !Array.isArray(o[k])) return `El campo «${k}» no tiene el formato esperado.`;
  }
  const bad = o.transactions.find(t=>!t || !t.id || !t.kind || !t.date);
  if(bad) return "Hay movimientos sin id, tipo o fecha: el archivo parece dañado.";
  const probs = backupProblems(o);
  if(probs.length) return `El archivo contiene datos con formato no válido y no se importará (${probs[0]}).`;
  return null;
}

/* Diálogo propio para pedir una frase de paso (prompt() nativo no es
   fiable en la PWA de iOS y además mostraría el texto en claro). */
let pendingPass = null;
function askPassphrase(message){
  return new Promise(resolve=>{
    pendingPass = resolve;
    document.getElementById("passText").textContent = message;
    const inp = document.getElementById("passInput");
    inp.value = "";
    document.getElementById("passOverlay").classList.remove("hidden");
    setTimeout(()=>inp.focus(), 50);
  });
}
Roney.passOk = function(){
  const v = document.getElementById("passInput").value;
  document.getElementById("passInput").value = "";
  document.getElementById("passOverlay").classList.add("hidden");
  const r = pendingPass; pendingPass = null; if(r) r(v);
};
Roney.passCancel = function(){
  document.getElementById("passInput").value = "";
  document.getElementById("passOverlay").classList.add("hidden");
  const r = pendingPass; pendingPass = null; if(r) r(null);
};

Roney.importData = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast("El archivo no es un JSON válido."); return; }
    let encrypted = false;
    if(parsed && parsed._format==="roney-encrypted-v1"){
      encrypted = true;
      if(!(window.crypto && crypto.subtle)){ toast("Este navegador no puede descifrar aquí (hace falta https)."); return; }
      const pass = await askPassphrase("Esta copia está cifrada. Introduce la frase de paso con la que se creó.");
      if(pass===null) return;
      try{ parsed = (await openWithPassphrase(parsed, pass)).data; }
      catch(e){ toast("Frase incorrecta o archivo dañado."); return; }
    }
    const err = validateBackup(parsed);
    if(err){ toast(err); return; }
    delete parsed._app; delete parsed._exportedAt;
    const note = vaultKey ? " Quedarán cifrados con tu frase de paso actual." : (encrypted ? " Ojo: en este dispositivo el cifrado no está activado; quedarán sin cifrar hasta que lo actives." : "");
    showConfirm(`Se sustituirán todos los datos actuales por los del archivo (${parsed.transactions.length} movimientos).${note} Te recomiendo exportar antes una copia de los actuales. ¿Continuar?`, () => {
      hydrateState(parsed);
      saveState(); render();
      toast("Datos importados.");
    }, {okLabel:"Importar"});
  };
  reader.readAsText(file);
  input.value = "";
};

/* Modo PIN antiguo → activar cifrado desde Ajustes. */
Roney.enableEncryption = async function(){
  const p1 = document.getElementById("encNew").value;
  const p2 = document.getElementById("encNew2").value;
  const pin = document.getElementById("encPin").value.trim();
  const problem = passphraseProblem(p1);
  if(pin !== localStorage.getItem(PIN_KEY)){ toast("El PIN actual no coincide."); return; }
  if(problem){ toast(problem); return; }
  if(p1!==p2){ toast("Las dos frases no coinciden."); return; }
  if(!document.getElementById("encAck").checked){ toast("Marca la casilla para confirmar que lo entiendes."); return; }
  if(!(window.crypto && crypto.subtle)){ toast("Este navegador no permite cifrar aquí (hace falta https)."); return; }
  const btn = document.getElementById("encBtn"); btn.disabled = true; btn.textContent = "Cifrando…";
  try{
    await migrateToVault(p1);
    render();
    toast("Cifrado activado. A partir de ahora entrarás con la frase de paso.");
  }catch(e){
    toast((e && e.message) || "No se pudo activar el cifrado.");
    btn.disabled = false; btn.textContent = "Activar cifrado";
  }
};

/* Cambiar la frase: se comprueba la actual contra el cofre (descifrándolo) y
   se vuelve a cifrar todo con una sal nueva. Las copias exportadas antes
   siguen abriéndose con la frase antigua. */
Roney.changePassphrase = async function(){
  const oldP = document.getElementById("passOld").value;
  const p1 = document.getElementById("passNew").value;
  const p2 = document.getElementById("passNew2").value;
  const problem = passphraseProblem(p1);
  if(problem){ toast(problem); return; }
  if(p1!==p2){ toast("Las dos frases nuevas no coinciden."); return; }
  const btn = document.getElementById("passBtn"); btn.disabled = true; btn.textContent = "Cifrando…";
  try{
    await saveChain;
    try{ await openWithPassphrase(readVault(), oldP); }
    catch(e){ toast("La frase actual no es correcta."); return; }
    const {key, salt, envelope} = await sealWithPassphrase(state, p1);
    // Verificación antes de sustituir el cofre en uso.
    const check = await openWithPassphrase(envelope, p1);
    if(JSON.stringify(check.data)!==JSON.stringify(state)) throw new Error("verificación");
    localStorage.setItem(VAULT_KEY, JSON.stringify(envelope));
    vaultKey = key; vaultSalt = salt; vaultIter = envelope.iter;
    ["passOld","passNew","passNew2"].forEach(id=>document.getElementById(id).value="");
    toast("Frase de paso cambiada. Las copias antiguas usan la frase anterior.");
  }catch(e){
    toast("No se pudo cambiar la frase; se mantiene la anterior.");
  }finally{
    btn.disabled = false; btn.textContent = "Cambiar frase de paso";
  }
};
Roney.changePin = function(){
  const cur = localStorage.getItem(PIN_KEY);
  const oldVal = document.getElementById("pinOld").value.trim();
  const newVal = document.getElementById("pinNew").value.trim();
  if(cur && oldVal!==cur){ toast("El PIN actual no coincide."); return; }
  if(newVal.length<4){ toast("El nuevo PIN debe tener al menos 4 dígitos."); return; }
  localStorage.setItem(PIN_KEY, newVal);
  toast("PIN actualizado.");
  document.getElementById("pinOld").value=""; document.getElementById("pinNew").value="";
};
Roney.wipeAll = function(){
  showConfirm("Esto borrará TODOS los datos de Roney en este dispositivo, sin posibilidad de deshacer. ¿Seguro?", async () => {
    await saveChain;

    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(VAULT_KEY);
    localStorage.removeItem(PIN_KEY);
    location.reload();
  }, {okLabel:"Borrar todo"});
};

Roney.addRecurringWrapped = function(){

        </select>
      </label>`;
  if(vaultKey){
    return `

      <div class="stack" style="margin-top:8px;">

      </div>
      ${autoLock}
      <p class="helper">Si olvidas la frase, nadie puede recuperar los datos: ni tú, ni Roney, ni Apple. Guárdala en el gestor de contraseñas del iPhone o en papel en un lugar seguro.</p>
    </div>`;
  }
  return `
    <div class="card" style="border-color:var(--cash);">
      <div class="row"><h3 style="font-size:15px;">Seguridad</h3><span class="badge" style="background:var(--soft-danger);color:var(--danger);">Sin cifrar</span></div>
      <p class="helper" style="margin-top:4px;">Ahora mismo el PIN solo bloquea la pantalla: tus datos y las copias exportadas están en texto plano. Al activar el cifrado, los datos actuales se cifran con una frase de paso (sin perder nada) y el PIN deja de usarse.</p>
      <div class="stack" style="margin-top:8px;">
        <input id="encPin" type="password" inputmode="numeric" placeholder="PIN actual" autocomplete="off" style="border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;min-height:44px;">
        ${inp("encNew","Frase de paso nueva (mín. 8 caracteres)","new-password")}
        ${inp("encNew2","Repite la frase","new-password")}
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.4;">
          <input id="encAck" type="checkbox" style="width:18px;height:18px;flex:0 0 auto;margin-top:1px;">
          Entiendo que si olvido la frase de paso mis datos no se podrán recuperar.
        </label>
        <button id="encBtn" class="btn primary" onclick="Roney.enableEncryption()">Activar cifrado</button>
      </div>
      <details style="margin-top:12px;">
        <summary class="muted" style="font-size:13px;">Cambiar el PIN (sin cifrar)</summary>

Roney.newEvent = function(){
  const name = document.getElementById("newEventName").value.trim();
  if(!name){ toast("Ponle nombre al evento."); return; }
  const ev = {id:uid(), name, createdAt:todayISO(), participants:[], expenses:[], settled:false, settlementTxId:null};
  state.social.unshift(ev);
  saveState();
  document.getElementById("newEventName").value="";
  ui.socialSelected = ev.id;
  render();
};
Roney.openEvent = function(id){ ui.socialSelected = id; ui.settleFlow = null; ui.expenseForm = {}; render(); };
Roney.backToEvents = function(){ ui.socialSelected = null; ui.settleFlow = null; render(); };
Roney.toggleHistorial = function(){ ui.showHistorial = !ui.showHistorial; render(); };

Roney.deleteEvent = function(id){
  const ev = state.social.find(e=>e.id===id);
  if(!ev) return;
  const msg = ev.settled
    ? "¿Eliminar este evento y todos sus gastos? Esta acción no se puede deshacer."
    : "Este evento todavía no se ha saldado. Si lo eliminas ahora, perderás el reparto de gastos sin haberlo liquidado. ¿Seguro que quieres eliminarlo?";
  showConfirm(msg, () => {
    if(ev.settlementTxId){ state.transactions = state.transactions.filter(t=>t.id!==ev.settlementTxId); }
    state.social = state.social.filter(e=>e.id!==id);
    saveState(); ui.socialSelected=null; ui.settleFlow=null; render();
    toast("Evento eliminado.");
  });
};

Roney.openSettleFlow = function(id){ ui.settleFlow = {eventId:id}; render(); };
Roney.closeSettleFlow = function(){ ui.settleFlow = null; render(); };

Roney.confirmSettle = function(eventId){
  const ev = state.social.find(e=>e.id===eventId);
  const meSel = document.getElementById("settleMe").value;
  let settlementTxId = null;
  if(meSel){
    const balCents = computeEventBalances(ev);
    const net = balCents[meSel] || 0;
    if(Math.abs(net) >= 1){
      const targetSel = document.getElementById("settleTarget").value;
      if(!targetSel){ toast("Selecciona dónde reflejar el saldo."); return; }
      const [targetType, targetId] = targetSel.split(":");
      const kind = net>0 ? "ingreso" : "gasto";
      const conceptId = ensureEventConcept(ev.name, kind);
      const tx = {
        id:uid(), kind, medium:targetType, amount: fromCents(Math.abs(net)), date: todayISO(), conceptId,
        accountId: targetType==="cuenta" ? targetId : undefined,
        bundleId: targetType==="efectivo" ? targetId : undefined,
      };
      state.transactions.unshift(tx);
      settlementTxId = tx.id;
    }
  }
  ev.settled = true; ev.settlementTxId = settlementTxId;
  saveState(); ui.settleFlow=null; render();
  toast("Evento saldado.");
};

Roney.reopenEvent = function(id){
  const ev = state.social.find(e=>e.id===id);
  const doReopen = () => {
    if(ev.settlementTxId){ state.transactions = state.transactions.filter(t=>t.id!==ev.settlementTxId); }
    ev.settled = false; ev.settlementTxId = null;
    saveState(); render();
    toast("Evento reabierto.");
  };
  if(ev.settlementTxId){
    showConfirm("Esto eliminará el movimiento de liquidación registrado en tus cuentas. ¿Continuar?", doReopen);
  }else{ doReopen(); }
};

/* Un evento saldado ya generó (opcionalmente) un movimiento de liquidación
   con el saldo de ese momento. Si se siguiera editando, ese movimiento
   dejaría de cuadrar con los saldos; por eso hay que reabrirlo antes. */
function eventLocked(ev){
  if(ev && ev.settled){ toast("El evento está saldado. Reábrelo para modificarlo."); return true; }
  return false;
}
Roney.addParticipant = function(eventId){
  const input = document.getElementById("newPartName");
  const name = input.value.trim();
  if(!name){ toast("Escribe un nombre."); return; }
  const ev = state.social.find(e=>e.id===eventId);
  if(eventLocked(ev)) return;
  if(ev.participants.some(p=>p.name.toLowerCase()===name.toLowerCase())){ toast("Ya hay un participante con ese nombre."); return; }
  ev.participants.push({id:uid(), name});
  saveState(); input.value=""; render();
};
Roney.removeParticipant = function(eventId, pid){
  const ev = state.social.find(e=>e.id===eventId);
  if(eventLocked(ev)) return;
  const used = ev.expenses.some(x=> x.payments.some(p=>p.participantId===pid) || x.splitAmong.includes(pid) || (x.splitAmounts && x.splitAmounts[pid]));
  if(used){ toast("No se puede eliminar: aparece en gastos registrados."); return; }
  ev.participants = ev.participants.filter(p=>p.id!==pid);
  saveState(); render();
};

Roney.setExpenseSplitMode = function(mode){ ui.expenseForm.splitMode = mode; render(); };

Roney.addExpense = function(eventId){
  const ev = state.social.find(e=>e.id===eventId);
  if(eventLocked(ev)) return;
  const desc = document.getElementById("expDesc").value.trim();
  const date = document.getElementById("expDate").value || todayISO();
  if(!desc){ toast("Añade una descripción."); return; }

  const payments = [];
  ev.participants.forEach(p=>{
    const el = document.getElementById("pay_"+p.id);
    const v = el ? parseAmount(el.value)||0 : 0;
    if(v>0) payments.push({participantId:p.id, amountCents: toCents(v)});
  });
  if(payments.length===0){ toast("Indica cuánto ha pagado al menos una persona."); return; }
  const totalCents = payments.reduce((s,p)=>s+p.amountCents,0);

  const mode = ui.expenseForm.splitMode || "equal";
  let splitAmong = [], splitAmounts = null;
  if(mode==="equal"){
    splitAmong = Array.from(document.querySelectorAll(".split-check:checked")).map(c=>c.value);
    if(splitAmong.length===0){ toast("Selecciona entre quiénes se reparte."); return; }
  }else{
    splitAmounts = {};
    let sum = 0;
    ev.participants.forEach(p=>{
      const el = document.getElementById("split_"+p.id);
      const v = el ? parseAmount(el.value)||0 : 0;
      if(v>0){ splitAmounts[p.id] = toCents(v); sum += toCents(v); }
    });
    if(Object.keys(splitAmounts).length===0){ toast("Indica cuánto le corresponde a cada persona."); return; }
    if(sum !== totalCents){ toast(`El reparto (${eur(fromCents(sum))}) no coincide con el total pagado (${eur(fromCents(totalCents))}).`); return; }
  }

  ev.expenses.unshift({id:uid(), description:desc, date, amount: fromCents(totalCents), payments, splitMode:mode, splitAmong, splitAmounts});
  saveState();
  ui.expenseForm = {};
  render();
  toast("Gasto añadido.");
};
Roney.removeExpense = function(eventId, expId){
  const ev = state.social.find(e=>e.id===eventId);
  if(eventLocked(ev)) return;
  const x = ev.expenses.find(e=>e.id===expId);
  showConfirm(`¿Eliminar el gasto «${x ? x.description : ""}»? Los saldos del evento se recalcularán.`, () => {
    ev.expenses = ev.expenses.filter(e=>e.id!==expId);
    saveState(); render();
    toast("Gasto eliminado.");
  });
};

function computeEventBalances(ev){
  const balCents = {}; ev.participants.forEach(p=>balCents[p.id]=0);
  ev.expenses.forEach(x=>{
    (x.payments||[]).forEach(pay=>{
      balCents[pay.participantId] = (balCents[pay.participantId]||0) + pay.amountCents;
    });
    if(x.splitMode==="custom" && x.splitAmounts){
      Object.entries(x.splitAmounts).forEach(([pid, cents])=>{
        balCents[pid] = (balCents[pid]||0) - cents;
      });
    }else{
      const totalCents = (x.payments||[]).reduce((s,p)=>s+p.amountCents,0);
      const n = x.splitAmong.length || 1;
      const base = Math.floor(totalCents/n);
      const remainder = totalCents - base*n;
      (x.splitAmong||[]).forEach((pid, idx)=>{
        const share = base + (idx < remainder ? 1 : 0);
        balCents[pid] = (balCents[pid]||0) - share;
      });
    }
  });
  return balCents;
}
function settleDebts(balCents){
  let creditors = Object.entries(balCents).filter(([,v])=>v>0).map(([id,v])=>({id,amt:v}));
  let debtors = Object.entries(balCents).filter(([,v])=>v<0).map(([id,v])=>({id,amt:-v}));
  creditors.sort((a,b)=>b.amt-a.amt); debtors.sort((a,b)=>b.amt-a.amt);
  const transfers=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const d=debtors[i], c=creditors[j];
    const amt = Math.min(d.amt,c.amt);
    if(amt>0) transfers.push({from:d.id, to:c.id, cents:amt});
    d.amt-=amt; c.amt-=amt;
    if(d.amt<=0) i++;
    if(c.amt<=0) j++;
  }
  return transfers;
}

Roney.copySettlement = function(eventId){
  const ev = state.social.find(e=>e.id===eventId);
  const balCents = computeEventBalances(ev);
  const transfers = settleDebts(balCents);
  const nameOf = id => ev.participants.find(p=>p.id===id)?.name || "?";
  let text = `Liquidación — ${ev.name}\n`;
  if(transfers.length===0) text += "Cuentas ya saldadas.";
  else text += transfers.map(t=>`${nameOf(t.from)} paga ${eur(fromCents(t.cents))} a ${nameOf(t.to)}`).join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Resumen copiado.")).catch(()=>toast("No se pudo copiar."));
  }else{
    toast("Copia no disponible en este navegador.");
  }
};
