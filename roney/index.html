/* --- Metas de ahorro --- */

Roney.addGoal = function(){
  const name = document.getElementById("goalName").value.trim();
  const targetAmount = amountFrom("goalTarget");
  const targetDate = document.getElementById("goalDate").value || null;
  const linkSel = document.getElementById("goalLink").value;
  if(!name){ toast("Ponle nombre a la meta."); return; }
  if(!targetAmount || targetAmount<=0){ toast("Indica una cantidad objetivo válida."); return; }
  let linkedType = null, linkedId = null;
  if(linkSel){ [linkedType, linkedId] = linkSel.split(":"); }
  state.goals.push({id:uid(), name, targetAmount, targetDate, linkedType, linkedId, contributions:[], createdAt:todayISO()});
  saveState(); ui.forms.goal=false; render();
  toast("Meta creada.");
};
Roney.removeGoal = function(id){
  showConfirm("¿Eliminar esta meta de ahorro? Se perderá el historial de aportaciones.", () => {
    state.goals = state.goals.filter(g=>g.id!==id);
    saveState(); render();
  });
};
Roney.toggleGoalContrib = function(id){ ui.forms["goalC_"+id] = !ui.forms["goalC_"+id]; render(); };
Roney.submitGoalContrib = function(id, sign){
  const v = amountFrom("goalContribAmount_"+id);
  if(!v || v<=0){ toast("Indica un importe válido."); return; }
  const g = state.goals.find(x=>x.id===id);
  const current = goalCurrent(g);
  if(sign<0 && v>current+0.001){ toast(`Solo tienes ${eur(current)} aportados a esta meta.`); return; }
  g.contributions.push({id:uid(), amount: v*sign, date:todayISO()});
  saveState(); ui.forms["goalC_"+id]=false; render();
  toast(sign>0 ? "Aportación registrada." : "Retirada registrada.");
};

function renderMetas(){
  const rows = state.goals.map(g=>{
    const current = goalCurrent(g);
    const pct = Math.max(0, Math.min(100, (current/g.targetAmount)*100));
    let dueInfo = "";
    if(g.targetDate){
      const days = daysBetween(todayISO(), g.targetDate);
      if(days>0){
        const monthsLeft = Math.max(1, days/30);
        const suggestion = Math.max(0, (g.targetAmount-current)/monthsLeft);
        dueInfo = `<div class="muted-2" style="font-size:12px;">Objetivo: ${g.targetDate} (${days} días) · sugerido ${eur(suggestion)}/mes</div>`;
      }else{
        dueInfo = `<div class="muted-2" style="font-size:12px;color:var(--danger);">Fecha objetivo ya pasada (${g.targetDate})</div>`;
      }
    }
    const linkLabel = g.linkedType ? (g.linkedType==="cuenta" ? accName(g.linkedId) : bunName(g.linkedId)) : null;
    return `
      <div class="card">
        <div class="row"><h3 style="font-size:15px;">${escapeHtml(g.name)}</h3>
          <button class="icon-btn" aria-label="Eliminar" onclick="Roney.removeGoal('${g.id}')">${trashIcon()}</button></div>
        ${linkLabel ? `<div class="badge" style="margin-bottom:6px;display:inline-block;">Apartado en: ${escapeHtml(linkLabel)}</div>` : ""}
        <div class="row" style="font-size:13px;margin:6px 0 4px;"><span class="muted">${eur(current)} de ${eur(g.targetAmount)}</span><span class="num">${Math.round(pct)}%</span></div>
        <div class="meter"><div class="meter-fill" style="width:${pct}%;background:var(--goal);"></div></div>
        ${dueInfo}
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn small goal" onclick="Roney.toggleGoalContrib('${g.id}')">${ui.forms["goalC_"+g.id]?'Cerrar':'+ Aportar / Retirar'}</button>
        </div>
        ${ui.forms["goalC_"+g.id] ? `
          <div class="btn-row" style="margin-top:8px;">
            ${moneyInput("goalContribAmount_"+g.id, "", 'style="flex:1;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 10px;"')}
            <button class="btn small income" onclick="Roney.submitGoalContrib('${g.id}',1)">Aportar</button>
            <button class="btn small expense" onclick="Roney.submitGoalContrib('${g.id}',-1)">Retirar</button>
          </div>` : ""}
      </div>`;
  }).join("");

  const accOpts = state.accounts.map(a=>`<option value="cuenta:${a.id}">${escapeHtml(a.alias)} (cuenta)</option>`).join("");
  const bunOpts = state.bundles.map(b=>`<option value="efectivo:${b.id}">${escapeHtml(b.name)} (efectivo)</option>`).join("");

  return `
    <div class="card">
      <div class="row"><h3 style="font-size:15px;">Nueva meta de ahorro</h3>
        <button class="btn small" onclick="Roney.toggleForm('goal')">${ui.forms.goal?'Cerrar':'+ Añadir'}</button></div>
      ${ui.forms.goal ? `
        <div class="stack" style="margin-top:10px;background:var(--bg);padding:12px;border-radius:var(--radius-sm);">
          <label class="field">Nombre<input id="goalName" placeholder="p. ej. Fondo de emergencia"></label>
          <div class="grid2">
            <label class="field">Cantidad objetivo (€)${moneyInput("goalTarget")}</label>
            <label class="field">Fecha objetivo (opcional)<input id="goalDate" type="date"></label>
          </div>
          <label class="field">Apartar dinero de (opcional)
            <select id="goalLink">
              <option value="">No vincular a ninguna cuenta/fajo</option>
              ${accOpts}${bunOpts}
            </select>
          </label>
          <button class="btn goal" onclick="Roney.addGoal()">Guardar meta</button>
        </div>` : ""}
    </div>
    ${rows || '<div class="card"><div class="empty">Sin metas de ahorro todavía.</div></div>'}
    <p class="helper">Si vinculas una meta a una cuenta o fajo, ese dinero se descuenta de lo «disponible» en esa cuenta (verás disponible/apartado/total) y Roney bloqueará cualquier gasto o transferencia que dejaría el saldo por debajo de lo apartado. Si no la vinculas, la meta es solo un seguimiento aparte que no afecta a tus cuentas reales.</p>
  `;
}

/* --- Préstamos --- */

Roney.addLoan = function(){
  const type = document.getElementById("loanType").value;
  const person = document.getElementById("loanPerson").value.trim();
  const amount = amountFrom("loanAmount");
  const date = document.getElementById("loanDate").value || todayISO();
  const dueDate = document.getElementById("loanDue").value || null;
  const note = document.getElementById("loanNote").value.trim();
  if(!person){ toast("Indica con quién es el préstamo."); return; }
  if(!amount || amount<=0){ toast("Importe no válido."); return; }
  state.loans.push({id:uid(), type, person, amount, date, dueDate, note, payments:[], settled:false});
  saveState(); ui.forms.loan=false; render();
  toast("Préstamo registrado.");
};
Roney.removeLoan = function(id){
  showConfirm("¿Eliminar este préstamo y su historial de pagos?", () => {
    state.loans = state.loans.filter(l=>l.id!==id);
    saveState(); render();
  });
};
Roney.toggleLoanPay = function(id){ ui.forms["loanP_"+id] = !ui.forms["loanP_"+id]; render(); };
Roney.submitLoanPayment = function(id){
  const v = amountFrom("loanPayAmount_"+id);
  if(!v || v<=0){ toast("Importe no válido."); return; }
  const l = state.loans.find(x=>x.id===id);
  const pending = l.amount - l.payments.reduce((s,p)=>s+p.amount,0);
  if(v > pending + 0.001){ toast(`Solo quedan ${eur(pending)} pendientes.`); return; }
  l.payments.push({id:uid(), amount:v, date:todayISO()});
  const remaining = l.amount - l.payments.reduce((s,p)=>s+p.amount,0);
  if(remaining<=0.005) l.settled = true;
  saveState(); ui.forms["loanP_"+id]=false; render();
  toast("Pago registrado.");
};
Roney.toggleLoanSettled = function(id){
  const l = state.loans.find(x=>x.id===id);
  l.settled = !l.settled;
  saveState(); render();
};

function renderPrestamos(){
  function loanCard(l){
    const paid = l.payments.reduce((s,p)=>s+p.amount,0);
    const remaining = Math.max(0, l.amount - paid);
    const pct = Math.max(0, Math.min(100, (paid/l.amount)*100));
    const overdue = l.dueDate && !l.settled && daysBetween(todayISO(), l.dueDate) < 0;
    return `
      <div class="card">
        <div class="row"><h3 style="font-size:15px;">${escapeHtml(l.person)} ${l.settled?'<span class="badge">Saldado</span>':''}</h3>
          <button class="icon-btn" aria-label="Eliminar" onclick="Roney.removeLoan('${l.id}')">${trashIcon()}</button></div>
        ${l.note ? `<div class="muted-2" style="font-size:12.5px;">${escapeHtml(l.note)}</div>` : ""}
        <div class="row" style="font-size:13px;margin:6px 0 4px;"><span class="muted">Pagado ${eur(paid)} de ${eur(l.amount)}</span><span class="num">${eur(remaining)} pendiente</span></div>
        <div class="meter"><div class="meter-fill" style="width:${pct}%;background:${l.type==='prestado'?'var(--income)':'var(--expense)'};"></div></div>
        ${l.dueDate ? `<div class="muted-2" style="font-size:12px;margin-top:4px;color:${overdue?'var(--danger)':'inherit'};">Vencimiento: ${l.dueDate}${overdue?' (vencido)':''}</div>` : ""}
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn small" onclick="Roney.toggleLoanPay('${l.id}')">${ui.forms["loanP_"+l.id]?'Cerrar':'+ Registrar pago'}</button>
          <button class="btn small ghost" onclick="Roney.toggleLoanSettled('${l.id}')">${l.settled?'Reabrir':'Marcar saldado'}</button>
        </div>
        ${ui.forms["loanP_"+l.id] ? `
          <div class="btn-row" style="margin-top:8px;">
            ${moneyInput("loanPayAmount_"+l.id, "", 'style="flex:1;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 10px;"')}
            <button class="btn small primary" onclick="Roney.submitLoanPayment('${l.id}')">Registrar</button>
          </div>` : ""}
      </div>`;
  }

  const prestados = state.loans.filter(l=>l.type==="prestado");
  const debidos = state.loans.filter(l=>l.type==="debido");
  const totalTeDeben = prestados.filter(l=>!l.settled).reduce((s,l)=>s+Math.max(0,l.amount-l.payments.reduce((a,p)=>a+p.amount,0)),0);
  const totalDebes = debidos.filter(l=>!l.settled).reduce((s,l)=>s+Math.max(0,l.amount-l.payments.reduce((a,p)=>a+p.amount,0)),0);

  return `
    <div class="grid2">
      <div class="card"><div class="label" style="color:var(--income);">Te deben en total</div><div style="font-size:19px;font-weight:700;" class="num">${eur(totalTeDeben)}</div></div>
      <div class="card"><div class="label" style="color:var(--expense);">Debes en total</div><div style="font-size:19px;font-weight:700;" class="num">${eur(totalDebes)}</div></div>
    </div>
    <div class="card">
      <div class="row"><h3 style="font-size:15px;">Nuevo préstamo</h3>
        <button class="btn small" onclick="Roney.toggleForm('loan')">${ui.forms.loan?'Cerrar':'+ Añadir'}</button></div>
      ${ui.forms.loan ? `
        <div class="stack" style="margin-top:10px;background:var(--bg);padding:12px;border-radius:var(--radius-sm);">
          <label class="field">Tipo
            <select id="loanType">
              <option value="prestado">Me deben (yo presté el dinero)</option>
              <option value="debido">Debo (a mí me prestaron)</option>
            </select>
          </label>
          <label class="field">Persona<input id="loanPerson" placeholder="Nombre"></label>
          <div class="grid2">
            <label class="field">Importe (€)${moneyInput("loanAmount")}</label>
            <label class="field">Fecha<input id="loanDate" type="date" value="${todayISO()}"></label>
          </div>
          <label class="field">Vencimiento (opcional)<input id="loanDue" type="date"></label>
          <label class="field">Nota (opcional)<input id="loanNote" placeholder="p. ej. Adelanto para el viaje"></label>
          <button class="btn primary" onclick="Roney.addLoan()">Guardar préstamo</button>
        </div>` : ""}
    </div>
    <h3 style="font-size:15px;">Te deben</h3>
    ${prestados.map(loanCard).join("") || '<div class="card"><div class="empty">Nadie te debe nada registrado.</div></div>'}
    <h3 style="font-size:15px;">Debes</h3>
    ${debidos.map(loanCard).join("") || '<div class="card"><div class="empty">No debes nada registrado.</div></div>'}
  `;
}

/* --- Calculadora de amortización --- */

function computeAmortization(principal, annualRatePct, months){
  const i = (annualRatePct/100)/12;
  let payment;
  if(i===0) payment = principal/months;
  else payment = principal * i / (1 - Math.pow(1+i, -months));
  let balance = principal;
  let totalInterest = 0;
  const schedule = [{month:0, balance:principal}];
  for(let m=1; m<=months; m++){
    const interest = balance*i;
    const principalPart = payment - interest;
    balance = Math.max(0, balance - principalPart);
    totalInterest += interest;
    schedule.push({month:m, balance});
  }
  return {payment, totalInterest, totalPaid: payment*months, schedule};
}

Roney.loadLoanIntoCalc = function(){
  const sel = document.getElementById("amortLoanSelect");
  if(!sel || !sel.value) return;
  const l = state.loans.find(x=>x.id===sel.value);
  if(!l) return;
  const remaining = Math.max(0, l.amount - l.payments.reduce((s,p)=>s+p.amount,0));
  ui.amortCalc.principal = Number(remaining.toFixed(2));
  document.getElementById("amortPrincipal").value = String(ui.amortCalc.principal).replace(".", ",");
};

Roney.calcAmortization = function(){
  const principal = amountFrom("amortPrincipal");
  const rate = amountFrom("amortRate");
  const months = Number(document.getElementById("amortMonths").value);
  if(!principal || principal<=0){ toast("Indica un importe válido."); return; }
  if(isNaN(rate) || rate<0){ toast("Indica un tipo de interés válido (0 o más)."); return; }
  if(!months || months<=0){ toast("Indica un plazo en meses válido."); return; }
  ui.amortCalc = {principal, rate, months, result: computeAmortization(principal, rate, months)};
  render();
};

function renderAmortizacion(){
  const c = ui.amortCalc;
  const debidos = state.loans.filter(l=>l.type==="debido" && !l.settled);
  const loanOptions = debidos.map(l=>`<option value="${l.id}">${escapeHtml(l.person)} (${eur(l.amount - l.payments.reduce((s,p)=>s+p.amount,0))} pendiente)</option>`).join("");

  let resultHtml = "";
  if(c.result){
    const r = c.result;
    const sampled = [];
    const step = Math.max(1, Math.ceil(r.schedule.length/13));
    for(let idx=0; idx<r.schedule.length; idx+=step) sampled.push(r.schedule[idx]);
    if(sampled[sampled.length-1].month !== r.schedule[r.schedule.length-1].month) sampled.push(r.schedule[r.schedule.length-1]);
    const chartData = sampled.map(s=>({name:"m"+s.month, value:s.balance}));
    const interestPct = Math.round((r.totalInterest/r.totalPaid)*100);

    resultHtml = `
      <div class="card">
        <h3 style="font-size:15px;margin-bottom:8px;">Resultado</h3>
        <div class="grid2">
          <div><div class="label">Cuota mensual</div><div style="font-size:19px;font-weight:700;" class="num">${eur(r.payment)}</div></div>
          <div><div class="label">Total a pagar</div><div style="font-size:19px;font-weight:700;" class="num">${eur(r.totalPaid)}</div></div>
        </div>
        <div class="row" style="margin-top:10px;font-size:13px;"><span class="muted">De ese total, intereses</span><span class="num">${eur(r.totalInterest)} (${interestPct}%)</span></div>
        <div class="meter" style="margin-top:4px;"><div class="meter-fill" style="width:${interestPct}%;background:var(--expense);"></div></div>
        <h3 style="font-size:14px;margin:14px 0 4px;">Saldo pendiente a lo largo del préstamo</h3>
        ${svgLineChart(chartData, {color:"#2F6FED", sparse:2})}
      </div>`;
  }

  return `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:2px;">Calculadora de amortización</h3>
      <p class="helper" style="margin-top:0;">Pensada para entenderla sin conocimientos previos de finanzas.</p>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:12px;font-size:13px;line-height:1.6;color:var(--text);margin-bottom:12px;">
        Cuando pides un préstamo, cada mes pagas una <b>cuota fija</b>. Esa cuota se reparte siempre en dos partes: los <b>intereses</b> (lo que cobra quien te presta el dinero, calculado como un % anual sobre lo que aún debes) y la <b>amortización</b> (la devolución real del dinero prestado, llamado «principal»). Al principio del préstamo pagas más intereses y menos principal; según avanzan las cuotas, esa proporción se invierte y cada vez amortizas más y pagas menos intereses, aunque la cuota no cambie.
      </div>
      ${debidos.length>0 ? `
        <label class="field" style="margin-bottom:10px;">Cargar datos desde un préstamo registrado (opcional)
          <select id="amortLoanSelect" onchange="Roney.loadLoanIntoCalc()">
            <option value="">— Introducir manualmente —</option>
            ${loanOptions}
          </select>
        </label>` : ""}
      <div class="grid3">
        <label class="field">Principal (€)${moneyInput("amortPrincipal", c.principal)}</label>
        <label class="field">Interés anual (%)${moneyInput("amortRate", c.rate)}</label>
        <label class="field">Plazo (meses)<input id="amortMonths" type="number" inputmode="numeric" min="1" step="1" value="${c.months}"></label>
      </div>
      <button class="btn primary block" style="margin-top:10px;" onclick="Roney.calcAmortization()">Calcular</button>
    </div>
    ${resultHtml}
  `;
}

/* --------------------------------- init ---------------------------------- */

document.addEventListener("DOMContentLoaded", () => {
  // Los datos no se cargan aquí: en modo PIN se leen al desbloquear y en
  // modo cofre solo existen tras descifrar con la frase de paso.
  initLock();
  setupAutoLock();
  // Pide al sistema que no borre los datos de la app para liberar espacio (iOS/Safari pueden hacerlo).
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator){
    // Falla en silencio si se abre como archivo local (file://) o sin HTTPS,
    // donde los service workers no están disponibles; la app sigue
    // funcionando igual, solo sin caché offline.
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
});
</script>
