      <div class="btn-row"><button class="btn btn-sm" data-act="export">${ic("download","ic-sm")}Exportar sin cifrar</button><button class="btn btn-sm" data-act="import">${ic("upload","ic-sm")}Importar copia</button></div>
      <p class="note" style="margin-bottom:0">Para cambiar de móvil: exporta aquí, instala GymTrack en el móvil nuevo y usa «Importar copia». La importación acepta copias cifradas y sin cifrar.</p>
      <input type="file" accept="application/json,.json" data-f="file" hidden></div>
    <div class="section"><h2>Almacenamiento</h2></div>
    <div class="card">
      <div class="kv"><span>Disponible</span><span>${storageInfo.available ? "Sí" : `<b style="color:var(--bad)">No</b>`}</span></div>
      <div class="kv"><span>Protegido frente a limpieza automática</span><span>${storageInfo.persisted===true ? "Sí" : storageInfo.persisted===false ? "No concedido" : "Desconocido"}</span></div>
      <div class="kv"><span>Tamaño de tus datos</span><span>${bytes(size)} de ≈5 MB</span></div>
      <p class="note">Safari puede borrar los datos de webs que no visitas en 7 días; las apps añadidas a la pantalla de inicio no tienen ese límite. Un archivo exportado es la única copia fuera del dispositivo.</p></div>
    <div class="section"><h2>Contenido</h2></div>
    <div class="card">${[["Sesiones", sum.logs],["Rutinas", sum.profiles],["Ejercicios", sum.exercises],["Días de alimentación anotados", sum.foodNotes],["Registros antiguos por alimento (sin uso)", sum.foodLogs],["Noches", sum.sleepLogs],["Pesajes", sum.bodyweight],["Suplementos", sum.supplements]].map(([k,n]) => `<div class="kv"><span>${k}</span><span>${n}</span></div>`).join("")}
      ${(r.logsFixed + r.itemsFixed + r.logsUnresolved + r.itemsUnresolved) ? `<p class="note">Al cargar se repararon ${r.logsFixed + r.itemsFixed} referencias a ejercicios${r.logsUnresolved + r.itemsUnresolved ? `; ${r.logsUnresolved + r.itemsUnresolved} no se pudieron resolver y aparecen como «Ejercicio no encontrado»` : ""}.</p>` : ""}
      <p class="note">Formato de datos v${G.SCHEMA_VERSION} · GymTrack ${APP_VERSION}. Las versiones anteriores de tus datos se conservan sin tocar en el almacenamiento.</p></div>`, {
    export(){ exportData(false); },
    exportEnc(){ exportData(true); },
    import(){ $('[data-f="file"]', main).click(); }
  }, null, t => { if(t.dataset.f==="file" && t.files && t.files[0]) importFile(t.files[0]); });
};
function markExported(){ state.settings.lastExportAt = Date.now(); save(); if(route.page==="data") rerender(); }
/* Cifrado de copias con contraseña. Mismo esquema que GodPole y Roney: PBKDF2-SHA256 (600 000
   iteraciones, sal aleatoria) + AES-256-GCM (IV aleatorio; detecta cualquier modificación).
   Solo con WebCrypto del navegador, sin librerías. Sin la contraseña no hay recuperación posible. */
const ENC_FORMAT = "gymtrack-encrypted-v1", ENC_ITER = 600000, MIN_PASS = 8;
function cryptoAvailable(){ return !!(window.crypto && crypto.subtle && window.isSecureContext !== false); }
function b64(buf){ const a = new Uint8Array(buf); let s = ""; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(s); }
function unb64(str){ const bin = atob(str); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptText(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await deriveKey(pass, salt, ENC_ITER), new TextEncoder().encode(text));
  return JSON.stringify({_app:"GymTrack", _format:ENC_FORMAT, _exportedAt:new Date().toISOString(), v:1, kdf:"PBKDF2-SHA256", iter:ENC_ITER, salt:b64(salt), iv:b64(iv), ct:b64(ct)});
}
async function decryptEnvelope(env, pass){
  if(!env || env.kdf!=="PBKDF2-SHA256" || typeof env.salt!=="string" || typeof env.iv!=="string" || typeof env.ct!=="string") throw new Error("El archivo cifrado está incompleto o dañado.");
  const iter = Number(env.iter);
  if(!Number.isInteger(iter) || iter < 100000 || iter > 5000000) throw new Error("El archivo cifrado tiene parámetros no válidos.");
  const key = await deriveKey(pass, unb64(env.salt), iter);
  try{ return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(env.iv)}, key, unb64(env.ct))); }
  catch(e){ throw new Error("Contraseña incorrecta o archivo modificado."); }
}
/* Pide la contraseña en una hoja propia (prompt() no es fiable en la app instalada en iOS).
   Con confirm, la pide dos veces. Resuelve con la contraseña o null si se cancela. */
function askPassphrase(title, message, confirm){
  return new Promise(resolve => {
    let result = null;
    const field = (id, label, ac) => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" type="password" autocomplete="${ac}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>`;
    const sh = openSheet({title, onClose:() => resolve(result),
      render:() => `<p class="small muted" style="margin:0 0 12px">${esc(message)}</p>
        ${field("pp-1", "Contraseña", confirm ? "new-password" : "current-password")}${confirm ? field("pp-2", "Repite la contraseña", "new-password") : ""}
        <div class="small" data-pp-err style="color:var(--bad); min-height:1.2em; margin-bottom:10px"></div>
        <button class="btn btn-primary btn-block" data-act="ok">${confirm ? "Cifrar y exportar" : "Abrir copia"}</button>`,
      handlers:{ ok(t, e, api){
        const v = $("#pp-1", api.body).value, err = $("[data-pp-err]", api.body);
        if(confirm && v.length < MIN_PASS){ err.textContent = `La contraseña debe tener al menos ${MIN_PASS} caracteres.`; return; }
        if(!confirm && !v){ err.textContent = "Escribe la contraseña."; return; }
        if(confirm && v !== $("#pp-2", api.body).value){ err.textContent = "Las dos contraseñas no coinciden."; return; }
        result = v; api.close();
      }}});
    sh.body.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.matches("input")) sh.h.ok(null, e, sh); });
    setTimeout(() => { const i = $("#pp-1", sh.body); if(i) i.focus(); }, 300);
  });
}
async function exportData(encrypted){
  let text = JSON.stringify(G.buildExport(state)); let name = `gymtrack-${today()}.json`;
  if(encrypted){
    if(!cryptoAvailable()){ toast("El cifrado necesita la app instalada (https)."); return; }
    const pass = await askPassphrase("Copia cifrada", `Elige una contraseña (mínimo ${MIN_PASS} caracteres). La necesitarás para importar la copia en otro móvil. Si la olvidas, no hay forma de recuperarla.`, true);
    if(!pass) return;
    toast("Cifrando…"); text = await encryptText(text, pass); name = `gymtrack-${today()}-cifrada.json`;
  }else if(!(await confirmDialog("Cualquiera que tenga el archivo podrá leer tus datos de entrenamiento, sueño y peso.", {title:"¿Exportar sin cifrar?", okLabel:"Exportar"}))){
    return;
  }
  const blob = new Blob([text], {type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){ await navigator.share({files:[file], title:"Copia de GymTrack"}); markExported(); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); markExported(); toast("Archivo exportado.");
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = async () => {
    let text = String(rd.result), res;
    try{
      let o = null; try{ o = text.length < 25*1024*1024 ? JSON.parse(text) : null; }catch(_){}
      if(o && o._format===ENC_FORMAT){
        if(!cryptoAvailable()){ toast("Para abrir una copia cifrada, usa GymTrack instalada (https)."); return; }
        const pass = await askPassphrase("Copia cifrada", "Esta copia está protegida. Escribe la contraseña con la que la creaste.", false);
        if(!pass) return;
        toast("Descifrando…"); text = await decryptEnvelope(o, pass);
      }
      res = G.parseImport(text);
    }catch(e){ toast(e.message); return; }
    const s = G.summarize(res.state);
    const ok = await confirmDialog(`El archivo contiene ${plural(s.logs,"sesión","sesiones")}, ${plural(s.profiles,"rutina")}, ${s.foodNotes} días de alimentación y ${s.sleepLogs} noches. Sustituirá todos los datos actuales de este dispositivo.`, {title:"¿Importar copia?", danger:true, okLabel:"Sustituir datos"});
    if(!ok) return;
    try{ Object.keys(localStorage).filter(k => k.startsWith("gymtrack_backup_before_import_")).forEach(k => store.remove(k)); }catch(e){}
    store.set("gymtrack_backup_before_import_" + Date.now(), JSON.stringify(state));
    state = res.state; save(); draft = null; saveDraft(); stopRest(); render(true); toast("Datos importados.");
  };
  rd.onerror = () => toast("No se pudo leer el archivo.");
  if(file.size > 25*1024*1024){ toast("El archivo es demasiado grande para ser una copia de GymTrack."); return; }
  rd.readAsText(file);
}

/* ======================= PERFIL ======================= */
function openBodyweightSheet(){
  let val = "";
  openSheet({title:"Peso corporal", render:() => { const list = state.bodyweightLog.slice().sort((a,b) => b.date.localeCompare(a.date));
    return `<div class="field"><label for="bw-in">Peso de hoy (kg)</label><div style="display:flex; gap:8px"><input class="input mono" id="bw-in" inputmode="decimal" data-k="kg" value="${esc(val)}" placeholder="${list[0]?fmt(list[0].kg,1):"75,0"}" style="font-size:20px"><button class="btn btn-primary" data-act="add">Guardar</button></div></div>
      <p class="note" style="margin:-6px 0 12px">Pésate en condiciones parecidas (en ayunas, tras ir al baño). Si ya hay un pesaje hoy, se sustituye.</p>
      ${list.length ? `<div class="card flush">${list.slice(0,12).map(b => `<div class="row"><div class="grow"><div class="title">${esc(relDay(b.date))}</div></div><span class="mono">${fmt(b.kg,1)} kg</span><button class="icon-btn" data-act="del" data-id="${b.id}" aria-label="Borrar pesaje">${ic("trash","ic-sm")}</button></div>`).join("")}</div>` : ""}`; },
  handlers:{ __input(t){ if(t.dataset.k) val = t.value; },
    add(t, e, sh){ const kg = G.parseNum(val); if(!(kg >= 25 && kg <= 300)){ toast("Introduce un peso entre 25 y 300 kg."); return; }
      const d = today(); const ex = state.bodyweightLog.find(b => b.date===d); if(ex) ex.kg = G.round2(kg); else state.bodyweightLog.push({id:G.uid(), date:d, kg:G.round2(kg)});
      val = ""; save(); sh.refresh(); rerender(); toast("Peso guardado."); },
    del(t, e, sh){ state.bodyweightLog = state.bodyweightLog.filter(b => b.id!==t.dataset.id); save(); sh.refresh(); rerender(); } }});
}
function openProfileSheet(){
  const b = state.bio; const v = {h:b.heightCm||"", age:b.age||"", sex:b.sex||"", act:b.activityLevel||"", goal:b.goal||""};
  const pages = [["exercises","list","Ejercicios","Base de ejercicios y material"],["history","history","Historial","Calendario y sesiones pasadas"],["supplements","pill","Suplementos","Registro y evidencia"],["data","shield","Copia de seguridad","Exportar, importar y almacenamiento"]];
  openSheet({title:"Perfil", render:() => { const bw = latestBW(); const bmi = bw && b.heightCm ? bw.kg/Math.pow(b.heightCm/100, 2) : null;
    return `<div style="display:flex; align-items:center; gap:14px; margin-bottom:16px">${appMark(56)}<div><div style="font-weight:700; font-size:17px">GymTrack</div><div class="small muted">Entrenamiento, alimentación y sueño</div></div></div>
      <div class="field"><label>Altura (cm)</label><input class="input mono" inputmode="numeric" data-k="h" value="${esc(v.h)}" placeholder="178"></div>
      <div class="field"><label>Sexo biológico</label><div class="seg"><button data-act="sex" data-s="M" aria-pressed="${v.sex==="M"}">Hombre</button><button data-act="sex" data-s="F" aria-pressed="${v.sex==="F"}">Mujer</button><button data-act="sex" data-s="" aria-pressed="${!v.sex}">Sin indicar</button></div></div>
      <div class="field"><label>Objetivo</label><select class="input" data-k="goal"><option value="">Sin definir</option>${G.GOALS.map(g => `<option value="${g.id}" ${g.id===v.goal?"selected":""}>${g.label}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-block" data-act="save">Guardar datos</button>
      <p class="note">La altura se usa para el IMC y el sexo para los baremos de fuerza relativa (Progreso). No salen de tu dispositivo.</p>
      <div class="section"><h2>Peso corporal</h2><button class="link" data-act="bw">${ic("scale","ic-sm")}Registrar</button></div>
      <div class="stats"><div class="stat"><div class="l">Último</div><div class="v">${bw ? fmt(bw.kg,1)+"<small> kg</small>" : "—"}</div><div class="d">${bw ? relDay(bw.date) : "Sin registros"}</div></div>
        <div class="stat"><div class="l">IMC</div><div class="v">${bmi ? fmt(bmi,1) : "—"}</div><div class="d">Orientativo: no distingue músculo de grasa</div></div></div>
      <div class="section"><h2>Descanso entre series</h2></div>
      <div class="seg">${[60,90,120,180,240].map(s => `<button data-act="rest" data-s="${s}" aria-pressed="${state.settings.restSec===s}">${s<120?s+" s":fmt(s/60,1)+" min"}</button>`).join("")}</div>
      <div class="section"><h2>Más</h2></div>
      <div class="card flush">${pages.map(([id, icn, t, d]) => `<button class="row tappable" data-act="page" data-p="${id}" style="width:100%; text-align:left"><span style="color:var(--text-2)">${ic(icn)}</span><div class="grow"><div class="title">${t}</div><div class="sub">${d}</div></div><span class="chev">${ic("chevR","ic-sm")}</span></button>`).join("")}</div>
      <p class="note" style="text-align:center">GymTrack ${APP_VERSION} · datos v${G.SCHEMA_VERSION} · sin cuentas ni seguimiento</p>`; },
  handlers:{
    __input(t){ if(t.dataset.k && t.tagName!=="SELECT") v[t.dataset.k] = t.value; },
    __change(t){ if(t.dataset.k) v[t.dataset.k] = t.value; },
    sex(t, e, sh){ v.sex = t.dataset.s; sh.refresh(); },
    save(t, e, sh){
      const h = String(v.h).trim()==="" ? null : G.parseNum(v.h);
      if(h!==null && !(h >= 120 && h <= 230)){ toast("Altura entre 120 y 230 cm."); return; }
      Object.assign(state.bio, {heightCm:h, sex:v.sex||null, goal:v.goal||null}); // age y activityLevel se conservan sin tocar
      save(); sh.refresh(); rerender(); toast("Perfil guardado.");
    },
    rest(t, e, sh){ state.settings.restSec = +t.dataset.s; save(); sh.refresh(); if(route.tab==="train" && !route.page) rerender(); },
    bw(){ openBodyweightSheet(); },
    page(t, e, sh){ sh.close(); openPage(t.dataset.p); }
  }});
}

/* ======================= Arranque ======================= */
renderBanner();
if(loadReport.from==="v4" || loadReport.from==="v3" || loadReport.from==="v2"){
  const r = loadReport.repair; const fixed = r.logsFixed + r.itemsFixed;
  setTimeout(() => toast(`Datos actualizados al formato nuevo${fixed?` · ${fixed} referencias reparadas`:""}.`), 400);
}
if(loadReport.notes.some(n => n.type==="corrupt" && n.key==="v5")) setTimeout(() => toast("Los datos guardados estaban dañados: se ha recuperado la versión anterior y se guardó una copia del original."), 600);
drawRest();
render(true);
/* Modo sin conexión: el service worker guarda la app en el móvil tras la primera visita.
   No funciona abriendo el archivo con doble clic (file://), solo publicada en https o en localhost. */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW no registrado", e)); });
}
})();
